<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitter Hours & Pay Tracker</title>
    <!-- Dynamic Apple Touch Icon for Home Screen -->
    <link rel="apple-touch-icon" id="appleTouchIcon" href="">
    <link rel="icon" id="favicon" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .modal {
            transition: opacity 0.25s ease;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div id="headerIconPreview" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-sm overflow-hidden">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-lg font-bold tracking-tight">Sitter Tracker</h1>
            </div>
            <button onclick="openSettings()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <!-- Calculator Card -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-semibold text-slate-900 mb-4 flex items-center gap-2">
                <span>Log Shift</span>
            </h2>

            <form id="shiftForm" class="space-y-4" onsubmit="event.preventDefault(); calculateAndSave();">
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Date</label>
                    <input type="date" id="shiftDate" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Start Time</label>
                        <input type="time" id="startTime" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">End Time</label>
                        <input type="time" id="endTime" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Hourly Rate ($)</label>
                        <input type="number" step="0.5" id="hourlyRate" value="20" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Unpaid Break (mins)</label>
                        <input type="number" id="unpaidBreak" value="0" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Reimbursable Expenses ($)</label>
                    <input type="number" step="0.01" id="expenses" value="0.00" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Notes / Description</label>
                    <input type="text" id="notes" placeholder="e.g., Snacks, park entrance, extra task" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-3 rounded-xl transition shadow-sm active:scale-[0.99]">
                    Save Shift
                </button>
            </form>
        </section>

        <!-- History Log -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-semibold text-slate-900">Shift History</h2>
                <button onclick="clearHistory()" class="text-xs text-rose-500 hover:underline">Clear All</button>
            </div>
            <div id="historyList" class="space-y-3">
                <p class="text-sm text-slate-400 text-center py-4">No shifts logged yet.</p>
            </div>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900">App Settings</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">&times;</button>
            </div>

            <!-- Custom Icon Upload Section -->
            <div class="space-y-3 border-t border-slate-100 pt-4">
                <h4 class="text-sm font-semibold text-slate-800">Home Screen Icon</h4>
                
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                    <label class="block text-xs font-medium text-slate-600">Option 1: Upload Your PNG File</label>
                    <div class="flex items-center space-x-3">
                        <div id="customIconPreview" class="w-12 h-12 rounded-xl bg-slate-200 flex items-center justify-center overflow-hidden border border-slate-300">
                            <span class="text-xs text-slate-400">None</span>
                        </div>
                        <input type="file" id="iconFileInput" accept="image/png, image/jpeg" class="hidden" onchange="handleIconUpload(event)">
                        <button onclick="document.getElementById('iconFileInput').click()" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold py-2 px-3 rounded-xl shadow-sm transition">
                            Choose PNG from Files
                        </button>
                    </div>
                    <p class="text-[11px] text-slate-500">Pick the custom PNG saved in your iPhone Files or Photos.</p>
                </div>

                <div id="removeCustomIconBtn" class="hidden">
                    <button onclick="removeCustomIcon()" class="text-xs text-rose-500 hover:underline">Remove Custom PNG Icon</button>
                </div>
            </div>

            <button onclick="closeSettings()" class="w-full bg-slate-900 text-white font-medium py-3 rounded-xl">
                Done
            </button>
        </div>
    </div>

    <script>
        // Set default date to today
        document.getElementById('shiftDate').valueToDate = new Date();
        document.getElementById('shiftDate').value = new Date().toISOString().substring(0, 10);

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // Handle Image Upload
        function handleIconUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                localStorage.setItem('sitter_app_custom_icon', base64Image);
                applyIcon(base64Image);
            };
            reader.readAsDataURL(file);
        }

        function removeCustomIcon() {
            localStorage.removeItem('sitter_app_custom_icon');
            applyIcon(null);
        }

        function applyIcon(imageDataUrl) {
            const appleIconLink = document.getElementById('appleTouchIcon');
            const faviconLink = document.getElementById('favicon');
            const previewContainer = document.getElementById('customIconPreview');
            const headerPreview = document.getElementById('headerIconPreview');
            const removeBtn = document.getElementById('removeCustomIconBtn');

            if (imageDataUrl) {
                appleIconLink.href = imageDataUrl;
                faviconLink.href = imageDataUrl;
                previewContainer.innerHTML = `<img src="${imageDataUrl}" class="w-full h-full object-cover">`;
                headerPreview.innerHTML = `<img src="${imageDataUrl}" class="w-full h-full object-cover">`;
                removeBtn.classList.remove('hidden');
            } else {
                appleIconLink.href = '';
                faviconLink.href = '';
                previewContainer.innerHTML = `<span class="text-xs text-slate-400">None</span>`;
                headerPreview.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                removeBtn.classList.add('hidden');
            }
        }

        // Load persisted icon on boot
        window.addEventListener('DOMContentLoaded', () => {
            const savedIcon = localStorage.getItem('sitter_app_custom_icon');
            if (savedIcon) {
                applyIcon(savedIcon);
            }
            loadHistory();
        });

        function calculateAndSave() {
            const date = document.getElementById('shiftDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
            const breakMins = parseInt(document.getElementById('unpaidBreak').value) || 0;
            const expenses = parseFloat(document.getElementById('expenses').value) || 0;
            const notes = document.getElementById('notes').value;

            // Compute total time
            const start = new Date(`1970-01-01T${startTime}:00`);
            let end = new Date(`1970-01-01T${endTime}:00`);
            if (end < start) end.setDate(end.getDate() + 1); // Overnight shift

            const diffMins = (end - start) / (1000 * 60) - breakMins;
            const totalHours = Math.max(0, diffMins / 60);
            const totalPay = (totalHours * rate) + expenses;

            const shift = {
                id: Date.now(),
                date,
                startTime,
                endTime,
                hours: totalHours.toFixed(2),
                rate,
                expenses: expenses.toFixed(2),
                pay: totalPay.toFixed(2),
                notes
            };

            const history = JSON.parse(localStorage.getItem('sitter_shifts') || '[]');
            history.unshift(shift);
            localStorage.setItem('sitter_shifts', JSON.stringify(history));

            loadHistory();
            document.getElementById('notes').value = '';
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('sitter_shifts') || '[]');
            const container = document.getElementById('historyList');

            if (history.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">No shifts logged yet.</p>`;
                return;
            }

            container.innerHTML = history.map(s => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center text-sm">
                    <div>
                        <div class="font-semibold text-slate-800">${s.date} (${s.hours} hrs)</div>
                        <div class="text-xs text-slate-500">${s.startTime} - ${s.endTime} ${s.notes ? '• ' + s.notes : ''}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-sky-700">$${s.pay}</div>
                        ${parseFloat(s.expenses) > 0 ? `<div class="text-[10px] text-slate-400">incl. $${s.expenses} exp</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('Clear all shift history?')) {
                localStorage.removeItem('sitter_shifts');
                loadHistory();
            }
        }
    </script>
</body>
</html>
