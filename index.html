<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Childcare & Babysitter Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-baby-carriage"></i> CareTracker
                </h1>
                <p class="text-xs text-indigo-200">Babysitter & Shift Tracker</p>
            </div>
            <div id="syncBadge" class="bg-indigo-700 text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-indigo-500">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="syncText">Connected</span>
            </div>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Navigation Tabs -->
        <div class="flex rounded-xl bg-slate-200 p-1 text-sm font-medium">
            <button onclick="switchTab('shiftsTab')" id="tabBtnShifts" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">
                <i class="fa-solid fa-clock mr-1"></i> Shifts
            </button>
            <button onclick="switchTab('sittersTab')" id="tabBtnSitters" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">
                <i class="fa-solid fa-users mr-1"></i> Sitters
            </button>
        </div>

        <!-- SHIFTS TAB -->
        <div id="shiftsTab" class="space-y-4">
            
            <!-- Quick Add Shift Button -->
            <button onclick="openShiftModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95">
                <i class="fa-solid fa-plus"></i> Log New Shift
            </button>

            <!-- Weekly Summary Card -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">This Week Summary</h2>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <p class="text-xs text-slate-500">Shifts</p>
                        <p id="sumCount" class="text-lg font-bold text-slate-800">0</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <p class="text-xs text-slate-500">Hours</p>
                        <p id="sumHours" class="text-lg font-bold text-slate-800">0.0</p>
                    </div>
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <p class="text-xs text-slate-500">Total Owed</p>
                        <p id="sumTotal" class="text-lg font-bold text-indigo-600">$0.00</p>
                    </div>
                </div>
            </div>

            <!-- Shifts List Container -->
            <div>
                <h2 class="text-sm font-semibold text-slate-600 mb-2 px-1">Recent Shifts</h2>
                <div id="shiftsList" class="space-y-3">
                    <div class="text-center py-8 text-slate-400 text-sm">
                        <i class="fa-solid fa-spinner animate-spin text-xl mb-2"></i>
                        <p>Loading shifts from cloud...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- SITTERS TAB -->
        <div id="sittersTab" class="space-y-4 hidden">
            <button onclick="openSitterModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-user-plus"></i> Add New Sitter
            </button>

            <div id="sittersList" class="space-y-3">
                <div class="text-center py-8 text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-xl mb-2"></i>
                    <p>Loading sitters...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL: ADD / EDIT SHIFT -->
    <div id="shiftModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="shiftModalTitle" class="font-bold text-lg text-slate-800">Log Shift</h3>
                <button onclick="closeShiftModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="shiftForm" onsubmit="saveShift(event)" class="space-y-3 text-sm">
                <input type="hidden" id="shiftId">

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Select Sitter</label>
                    <select id="shiftSitter" required onchange="updateDefaultRate()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <!-- Options populated via JS -->
                    </select>
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Date</label>
                    <input type="date" id="shiftDate" required class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 font-medium mb-1">Start Time</label>
                        <input type="time" id="shiftStart" required onchange="calcFormTotal()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-medium mb-1">End Time</label>
                        <input type="time" id="shiftEnd" required onchange="calcFormTotal()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 font-medium mb-1">Hourly Rate ($)</label>
                        <input type="number" step="0.50" id="shiftRate" required oninput="calcFormTotal()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-600 font-medium mb-1">Unpaid Break (mins)</label>
                        <input type="number" id="shiftBreak" value="0" min="0" oninput="calcFormTotal()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Expenses / Reimbursements ($)</label>
                    <input type="number" step="0.01" id="shiftExpense" value="0.00" oninput="calcFormTotal()" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Receipt / Photo Attachment</label>
                    <input type="file" id="shiftPhoto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <div id="photoPreviewContainer" class="mt-2 hidden">
                        <img id="photoPreview" class="h-20 w-auto rounded-lg object-cover border border-slate-200">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Notes</label>
                    <textarea id="shiftNotes" rows="2" placeholder="Tasks done, kids activities, snacks..." class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <!-- Calculated Earnings Preview -->
                <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center">
                    <span class="text-xs text-indigo-600 font-medium">Estimated Total: </span>
                    <span id="formEstTotal" class="text-base font-bold text-indigo-700">$0.00</span>
                    <span id="formEstHours" class="text-xs text-indigo-500 ml-1">(0 hrs)</span>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeShiftModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-medium">Cancel</button>
                    <button type="submit" id="saveShiftBtn" class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Save Shift</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT SITTER -->
    <div id="sitterModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="sitterModalTitle" class="font-bold text-lg text-slate-800">Add Sitter</h3>
                <button onclick="closeSitterModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="sitterForm" onsubmit="saveSitter(event)" class="space-y-3 text-sm">
                <input type="hidden" id="sitterId">

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Sitter Name</label>
                    <input type="text" id="sitterName" required placeholder="e.g. Sarah" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Default Hourly Rate ($)</label>
                    <input type="number" step="0.50" id="sitterRate" required placeholder="20.00" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">Venmo Username (optional)</label>
                    <input type="text" id="sitterVenmo" placeholder="e.g. sarah-babysitter" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-slate-600 font-medium mb-1">CashApp Tag (optional)</label>
                    <input type="text" id="sitterCashApp" placeholder="e.g. $SarahSits" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeSitterModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-medium">Cancel</button>
                    <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Save Sitter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: PAY / DETAILS -->
    <div id="payModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl text-center">
            <h3 class="font-bold text-lg text-slate-800">Shift Payment Details</h3>
            <div id="payModalContent" class="text-sm text-slate-600 space-y-2"></div>
            <div id="payModalLinks" class="space-y-2 pt-2"></div>
            <button onclick="closePayModal()" class="w-full py-2.5 rounded-xl border border-slate-300 text-slate-600 font-medium mt-2">Close</button>
        </div>
    </div>

    <!-- MODAL: PHOTO FULL VIEW -->
    <div id="photoModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 hidden" onclick="closePhotoModal()">
        <img id="fullPhoto" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain">
    </div>

    <!-- Firebase Storage & Sync Implementation Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase configuration using local app fallback
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForLocalStorageFallback",
            authDomain: "care-tracker-app.firebaseapp.com",
            projectId: "care-tracker-app",
            storageBucket: "care-tracker-app.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        let db = null;
        let useLocalStorage = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firestore init failed, falling back to LocalStorage persistence mode:", e);
            useLocalStorage = true;
        }

        // Global Application State
        window.sitters = [];
        window.shifts = [];

        // App Initialization
        document.addEventListener('DOMContentLoaded', () => {
            initDataSync();
            // Set default date in shift form to today
            document.getElementById('shiftDate').value = new Date().toISOString().split('T')[0];
        });

        // Data Sync Layer
        function initDataSync() {
            const syncText = document.getElementById('syncText');
            
            // Check if we are in local fallback or live Firebase sync
            if (useLocalStorage || window.location.hostname === 'localhost') {
                loadFromLocalStorage();
                syncText.innerText = "Local Auto-Save";
            } else {
                // Realtime Cloud Firestore listeners
                try {
                    const sittersCol = collection(db, 'sitters');
                    onSnapshot(sittersCol, (snapshot) => {
                        window.sitters = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        renderSitters();
                        populateSitterDropdown();
                    }, (err) => {
                        console.error("Firestore Sitters Err:", err);
                        loadFromLocalStorage();
                    });

                    const shiftsCol = collection(db, 'shifts');
                    onSnapshot(shiftsCol, (snapshot) => {
                        window.shifts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        renderShifts();
                        calculateSummary();
                    }, (err) => {
                        console.error("Firestore Shifts Err:", err);
                        loadFromLocalStorage();
                    });
                } catch(err) {
                    loadFromLocalStorage();
                }
            }
        }

        function loadFromLocalStorage() {
            window.sitters = JSON.parse(localStorage.getItem('care_sitters') || '[]');
            window.shifts = JSON.parse(localStorage.getItem('care_shifts') || '[]');
            renderSitters();
            populateSitterDropdown();
            renderShifts();
            calculateSummary();
        }

        function saveToLocalStorage() {
            localStorage.setItem('care_sitters', JSON.stringify(window.sitters));
            localStorage.setItem('care_shifts', JSON.stringify(window.shifts));
            renderSitters();
            populateSitterDropdown();
            renderShifts();
            calculateSummary();
        }

        // Calculation Helpers
        window.calcShiftHours = function(start, end, breakMins = 0) {
            if (!start || !end) return 0;
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);

            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;

            // Handle Overnight Shift
            if (endMin <= startMin) {
                endMin += 24 * 60;
            }

            let totalMins = endMin - startMin - Number(breakMins);
            return Math.max(0, totalMins / 60);
        };

        window.calcFormTotal = function() {
            const start = document.getElementById('shiftStart').value;
            const end = document.getElementById('shiftEnd').value;
            const rate = parseFloat(document.getElementById('shiftRate').value) || 0;
            const breakMins = parseFloat(document.getElementById('shiftBreak').value) || 0;
            const expense = parseFloat(document.getElementById('shiftExpense').value) || 0;

            const hours = window.calcShiftHours(start, end, breakMins);
            const total = (hours * rate) + expense;

            document.getElementById('formEstHours').innerText = `(${hours.toFixed(2)} hrs)`;
            document.getElementById('formEstTotal').innerText = `$${total.toFixed(2)}`;
        };

        // UI Tab Switcher
        window.switchTab = function(tabName) {
            document.getElementById('shiftsTab').classList.toggle('hidden', tabName !== 'shiftsTab');
            document.getElementById('sittersTab').classList.toggle('hidden', tabName !== 'sittersTab');

            const btnShifts = document.getElementById('tabBtnShifts');
            const btnSitters = document.getElementById('tabBtnSitters');

            if (tabName === 'shiftsTab') {
                btnShifts.className = "flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition font-medium";
                btnSitters.className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium";
            } else {
                btnSitters.className = "flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition font-medium";
                btnShifts.className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition font-medium";
            }
        };

        // Populate Sitters Select Menu
        function populateSitterDropdown() {
            const select = document.getElementById('shiftSitter');
            select.innerHTML = '';
            if (window.sitters.length === 0) {
                select.innerHTML = '<option value="">No sitters added yet</option>';
                return;
            }
            window.sitters.forEach(sitter => {
                const opt = document.createElement('option');
                opt.value = sitter.id;
                opt.textContent = `${sitter.name} ($${sitter.rate}/hr)`;
                select.appendChild(opt);
            });
            window.updateDefaultRate();
        }

        window.updateDefaultRate = function() {
            const sitterId = document.getElementById('shiftSitter').value;
            const sitter = window.sitters.find(s => s.id === sitterId);
            if (sitter) {
                document.getElementById('shiftRate').value = sitter.rate;
                window.calcFormTotal();
            }
        };

        // Render Sitters
        function renderSitters() {
            const container = document.getElementById('sittersList');
            if (window.sitters.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center border border-slate-200">
                        <i class="fa-solid fa-user-group text-slate-300 text-3xl mb-2"></i>
                        <p class="text-sm text-slate-500">No sitters saved yet. Click above to add your first babysitter!</p>
                    </div>`;
                return;
            }

            container.innerHTML = window.sitters.map(sitter => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">${sitter.name}</h3>
                        <p class="text-xs text-slate-500">$${Number(sitter.rate).toFixed(2)} / hour</p>
                        <div class="flex gap-2 mt-1.5 text-xs text-indigo-600 font-medium">
                            ${sitter.venmo ? `<span><i class="fa-brands fa-vimeo mr-0.5"></i> @${sitter.venmo}</span>` : ''}
                            ${sitter.cashapp ? `<span><i class="fa-solid fa-dollar-sign mr-0.5"></i> ${sitter.cashapp}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editSitter('${sitter.id}')" class="p-2 text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteSitter('${sitter.id}')" class="p-2 text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // Render Shifts
        function renderShifts() {
            const container = document.getElementById('shiftsList');
            if (window.shifts.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl text-center border border-slate-200">
                        <i class="fa-solid fa-calendar-xmark text-slate-300 text-3xl mb-2"></i>
                        <p class="text-sm text-slate-500">No shifts logged yet. Tap "Log New Shift" to get started.</p>
                    </div>`;
                return;
            }

            // Sort shifts newest date first
            const sorted = [...window.shifts].sort((a,b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = sorted.map(shift => {
                const sitter = window.sitters.find(s => s.id === shift.sitterId) || { name: shift.sitterName || 'Unknown Sitter' };
                const hours = window.calcShiftHours(shift.start, shift.end, shift.breakMins);
                const total = (hours * shift.rate) + (Number(shift.expense) || 0);

                return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${shift.date}</span>
                            <h3 class="font-bold text-slate-800 text-base mt-1">${sitter.name}</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-bold text-slate-900">$${total.toFixed(2)}</span>
                            <p class="text-xs text-slate-400">${hours.toFixed(1)} hrs @ $${shift.rate}/hr</p>
                        </div>
                    </div>

                    <div class="flex items-center text-xs text-slate-500 gap-3 border-t border-b border-slate-50 py-2">
                        <span><i class="fa-regular fa-clock mr-1 text-indigo-500"></i> ${shift.start} - ${shift.end}</span>
                        ${shift.breakMins > 0 ? `<span><i class="fa-solid fa-mug-hot mr-1 text-amber-500"></i> ${shift.breakMins}m break</span>` : ''}
                        ${shift.expense > 0 ? `<span><i class="fa-solid fa-receipt mr-1 text-emerald-500"></i> +$${Number(shift.expense).toFixed(2)} exp</span>` : ''}
                    </div>

                    ${shift.notes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl italic">"${shift.notes}"</p>` : ''}

                    ${shift.photo ? `
                        <div class="mt-2">
                            <img src="${shift.photo}" onclick="openPhotoModal('${shift.photo}')" class="h-16 w-16 object-cover rounded-xl border border-slate-200 cursor-pointer hover:opacity-90 transition">
                        </div>
                    ` : ''}

                    <div class="flex justify-between items-center pt-1">
                        <button onclick="openPayModal('${shift.id}')" class="text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-xl flex items-center gap-1">
                            <i class="fa-solid fa-paper-plane"></i> Pay Sitter
                        </button>

                        <div class="flex gap-1">
                            <button onclick="editShift('${shift.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteShift('${shift.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // Weekly Summary Calculation
        function calculateSummary() {
            const now = new Date();
            const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
            startOfWeek.setHours(0,0,0,0);

            let count = 0;
            let totalHours = 0;
            let totalPay = 0;

            window.shifts.forEach(shift => {
                const shiftDate = new Date(shift.date);
                if (shiftDate >= startOfWeek) {
                    count++;
                    const hours = window.calcShiftHours(shift.start, shift.end, shift.breakMins);
                    totalHours += hours;
                    totalPay += (hours * shift.rate) + (Number(shift.expense) || 0);
                }
            });

            document.getElementById('sumCount').innerText = count;
            document.getElementById('sumHours').innerText = totalHours.toFixed(1);
            document.getElementById('sumTotal').innerText = `$${totalPay.toFixed(2)}`;
        }

        // Shift Actions
        window.openShiftModal = function(editId = null) {
            document.getElementById('shiftForm').reset();
            document.getElementById('shiftId').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');

            if (editId) {
                const shift = window.shifts.find(s => s.id === editId);
                if (shift) {
                    document.getElementById('shiftModalTitle').innerText = "Edit Shift";
                    document.getElementById('shiftId').value = shift.id;
                    document.getElementById('shiftSitter').value = shift.sitterId;
                    document.getElementById('shiftDate').value = shift.date;
                    document.getElementById('shiftStart').value = shift.start;
                    document.getElementById('shiftEnd').value = shift.end;
                    document.getElementById('shiftRate').value = shift.rate;
                    document.getElementById('shiftBreak').value = shift.breakMins || 0;
                    document.getElementById('shiftExpense').value = shift.expense || 0;
                    document.getElementById('shiftNotes').value = shift.notes || '';

                    if (shift.photo) {
                        document.getElementById('photoPreview').src = shift.photo;
                        document.getElementById('photoPreviewContainer').classList.remove('hidden');
                    }
                    window.calcFormTotal();
                }
            } else {
                document.getElementById('shiftModalTitle').innerText = "Log Shift";
                document.getElementById('shiftDate').value = new Date().toISOString().split('T')[0];
                window.updateDefaultRate();
            }

            document.getElementById('shiftModal').classList.remove('hidden');
        };

        window.closeShiftModal = function() {
            document.getElementById('shiftModal').classList.add('hidden');
        };

        window.saveShift = async function(e) {
            e.preventDefault();
            const id = document.getElementById('shiftId').value;
            const sitterId = document.getElementById('shiftSitter').value;
            const sitter = window.sitters.find(s => s.id === sitterId);

            const fileInput = document.getElementById('shiftPhoto');
            let photoBase64 = null;

            if (fileInput.files && fileInput.files[0]) {
                photoBase64 = await convertFileToBase64(fileInput.files[0]);
            } else if (id) {
                const existing = window.shifts.find(s => s.id === id);
                if (existing) photoBase64 = existing.photo;
            }

            const shiftData = {
                sitterId: sitterId,
                sitterName: sitter ? sitter.name : 'Unknown',
                date: document.getElementById('shiftDate').value,
                start: document.getElementById('shiftStart').value,
                end: document.getElementById('shiftEnd').value,
                rate: parseFloat(document.getElementById('shiftRate').value),
                breakMins: parseFloat(document.getElementById('shiftBreak').value) || 0,
                expense: parseFloat(document.getElementById('shiftExpense').value) || 0,
                notes: document.getElementById('shiftNotes').value,
                photo: photoBase64
            };

            if (useLocalStorage || !db) {
                if (id) {
                    const idx = window.shifts.findIndex(s => s.id === id);
                    if (idx !== -1) window.shifts[idx] = { id, ...shiftData };
                } else {
                    window.shifts.push({ id: 'shift_' + Date.now(), ...shiftData });
                }
                saveToLocalStorage();
            } else {
                try {
                    if (id) {
                        await updateDoc(doc(db, 'shifts', id), shiftData);
                    } else {
                        await addDoc(collection(db, 'shifts'), { ...shiftData, createdAt: serverTimestamp() });
                    }
                } catch(err) {
                    console.error("Cloud Save Shift Error:", err);
                }
            }

            closeShiftModal();
        };

        window.deleteShift = async function(id) {
            if (!confirm('Are you sure you want to delete this shift?')) return;

            if (useLocalStorage || !db) {
                window.shifts = window.shifts.filter(s => s.id !== id);
                saveToLocalStorage();
            } else {
                try {
                    await deleteDoc(doc(db, 'shifts', id));
                } catch(err) {
                    console.error("Delete Error:", err);
                }
            }
        };

        window.editShift = function(id) {
            window.openShiftModal(id);
        };

        // Sitter Actions
        window.openSitterModal = function(editId = null) {
            document.getElementById('sitterForm').reset();
            document.getElementById('sitterId').value = '';

            if (editId) {
                const sitter = window.sitters.find(s => s.id === editId);
                if (sitter) {
                    document.getElementById('sitterModalTitle').innerText = "Edit Sitter";
                    document.getElementById('sitterId').value = sitter.id;
                    document.getElementById('sitterName').value = sitter.name;
                    document.getElementById('sitterRate').value = sitter.rate;
                    document.getElementById('sitterVenmo').value = sitter.venmo || '';
                    document.getElementById('sitterCashApp').value = sitter.cashapp || '';
                }
            } else {
                document.getElementById('sitterModalTitle').innerText = "Add Sitter";
            }

            document.getElementById('sitterModal').classList.remove('hidden');
        };

        window.closeSitterModal = function() {
            document.getElementById('sitterModal').classList.add('hidden');
        };

        window.saveSitter = async function(e) {
            e.preventDefault();
            const id = document.getElementById('sitterId').value;

            const sitterData = {
                name: document.getElementById('sitterName').value,
                rate: parseFloat(document.getElementById('sitterRate').value),
                venmo: document.getElementById('sitterVenmo').value.replace('@', '').trim(),
                cashapp: document.getElementById('sitterCashApp').value.replace('$', '').trim()
            };

            if (useLocalStorage || !db) {
                if (id) {
                    const idx = window.sitters.findIndex(s => s.id === id);
                    if (idx !== -1) window.sitters[idx] = { id, ...sitterData };
                } else {
                    window.sitters.push({ id: 'sitter_' + Date.now(), ...sitterData });
                }
                saveToLocalStorage();
            } else {
                try {
                    if (id) {
                        await updateDoc(doc(db, 'sitters', id), sitterData);
                    } else {
                        await addDoc(collection(db, 'sitters'), sitterData);
                    }
                } catch(err) {
                    console.error("Cloud Save Sitter Error:", err);
                }
            }

            closeSitterModal();
        };

        window.deleteSitter = async function(id) {
            if (!confirm('Are you sure you want to delete this sitter?')) return;

            if (useLocalStorage || !db) {
                window.sitters = window.sitters.filter(s => s.id !== id);
                saveToLocalStorage();
            } else {
                try {
                    await deleteDoc(doc(db, 'sitters', id));
                } catch(err) {
                    console.error("Delete Error:", err);
                }
            }
        };

        window.editSitter = function(id) {
            window.openSitterModal(id);
        };

        // Quick Pay Modal
        window.openPayModal = function(shiftId) {
            const shift = window.shifts.find(s => s.id === shiftId);
            if (!shift) return;

            const sitter = window.sitters.find(s => s.id === shift.sitterId) || { name: shift.sitterName };
            const hours = window.calcShiftHours(shift.start, shift.end, shift.breakMins);
            const total = (hours * shift.rate) + (Number(shift.expense) || 0);

            const content = document.getElementById('payModalContent');
            content.innerHTML = `
                <p class="font-bold text-slate-800 text-base">${sitter.name}</p>
                <p class="text-xs text-slate-500">${shift.date} (${shift.start} - ${shift.end})</p>
                <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 mt-2">
                    <p class="text-xs text-indigo-500">Amount Due</p>
                    <p class="text-2xl font-extrabold text-indigo-700">$${total.toFixed(2)}</p>
                </div>
            `;

            const links = document.getElementById('payModalLinks');
            links.innerHTML = '';

            if (sitter.venmo) {
                const venmoUrl = `https://venmo.com/${sitter.venmo}?txn=pay&amount=${total.toFixed(2)}&note=Babysitting%20-${shift.date}`;
                links.innerHTML += `
                    <a href="${venmoUrl}" target="_blank" class="w-full bg-[#008CFF] text-white py-2.5 px-4 rounded-xl font-semibold flex items-center justify-center gap-2 block">
                        <i class="fa-brands fa-vimeo"></i> Pay via Venmo
                    </a>`;
            }

            if (sitter.cashapp) {
                const cashAppUrl = `https://cash.app/$${sitter.cashapp}/${total.toFixed(2)}`;
                links.innerHTML += `
                    <a href="${cashAppUrl}" target="_blank" class="w-full bg-[#00D632] text-white py-2.5 px-4 rounded-xl font-semibold flex items-center justify-center gap-2 block">
                        <i class="fa-solid fa-dollar-sign"></i> Pay via Cash App
                    </a>`;
            }

            if (!sitter.venmo && !sitter.cashapp) {
                links.innerHTML = `<p class="text-xs text-slate-400 py-2">No Venmo/CashApp handles configured for ${sitter.name}. Edit sitter info in the Sitters tab to add handles.</p>`;
            }

            document.getElementById('payModal').classList.remove('hidden');
        };

        window.closePayModal = function() {
            document.getElementById('payModal').classList.add('hidden');
        };

        // Photo Preview Modal
        window.openPhotoModal = function(src) {
            document.getElementById('fullPhoto').src = src;
            document.getElementById('photoModal').classList.remove('hidden');
        };

        window.closePhotoModal = function() {
            document.getElementById('photoModal').classList.add('hidden');
        };

        // Utility: File to Base64
        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
