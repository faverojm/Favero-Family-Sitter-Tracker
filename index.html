<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Sitter Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
    
    /* PIN Modal */
    #pin-modal {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .pin-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; }
    .pin-display { font-size: 2rem; letter-spacing: 12px; margin-bottom: 24px; height: 40px; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 280px; }
    .pin-btn {
      aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 1.5rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .pin-btn:active { background: var(--border); }

    /* Main UI */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 10px; }
    h1 { font-size: 1.4rem; font-weight: 700; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    input, textarea {
      width: 100%; background: #2a2a2a; border: 1px solid var(--border); color: #fff;
      padding: 10px 12px; border-radius: 8px; font-size: 1rem; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    button.submit-btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px;
    }
    button.submit-btn:active { opacity: 0.8; }

    /* Shift List */
    .shift-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .shift-header { display: flex; justify-content: space-between; align-items: center; }
    .shift-name { font-weight: 600; font-size: 1.05rem; }
    .shift-pay { font-weight: 700; color: var(--green); font-size: 1.1rem; }
    .shift-meta { font-size: 0.85rem; color: var(--muted); display: flex; gap: 12px; }
    .shift-notes { font-size: 0.9rem; color: #d1d5db; margin-top: 4px; }
    .status-badge {
      display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .badge-paid { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-unpaid { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
  </style>
</head>
<body>

  <!-- PIN Modal -->
  <div id="pin-modal">
    <div class="pin-title">Enter Favero Family PIN</div>
    <div class="pin-display" id="pin-dots">••••</div>
    <div class="pin-pad">
      <div class="pin-btn" onclick="pressPin('1')">1</div>
      <div class="pin-btn" onclick="pressPin('2')">2</div>
      <div class="pin-btn" onclick="pressPin('3')">3</div>
      <div class="pin-btn" onclick="pressPin('4')">4</div>
      <div class="pin-btn" onclick="pressPin('5')">5</div>
      <div class="pin-btn" onclick="pressPin('6')">6</div>
      <div class="pin-btn" onclick="pressPin('7')">7</div>
      <div class="pin-btn" onclick="pressPin('8')">8</div>
      <div class="pin-btn" onclick="pressPin('9')">9</div>
      <div class="pin-btn" onclick="clearPin()">C</div>
      <div class="pin-btn" onclick="pressPin('0')">0</div>
      <div class="pin-btn" onclick="checkPin()">✓</div>
    </div>
  </div>

  <!-- Main App -->
  <header>
    <h1>Sitter Tracker</h1>
    <button onclick="lockApp()" style="background:none; border:none; color:var(--muted); font-size:0.85rem;">Lock</button>
  </header>

  <div class="card">
    <form id="shift-form">
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label>Sitter Name</label>
          <input type="text" id="sittername" placeholder="Name" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Hours</label>
          <input type="number" step="0.5" id="hours" placeholder="4.5" required>
        </div>
        <div class="form-group">
          <label>Total Pay ($)</label>
          <input type="number" step="1" id="pay" placeholder="90" required>
        </div>
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="Date night, tip included, etc."></textarea>
      </div>
      <button type="submit" class="submit-btn">Log Shift</button>
    </form>
  </div>

  <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--muted);">Shift History</h2>
  <div id="shift-list">Loading shifts...</div>

  <script>
    const API_URL = 'https://mvwmpoofylsrhmkdfzat.supabase.co/rest/v1/shifts';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12d21wb29meWxzcmhta2RmemF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTc3NzAsImV4cCI6MjEwNTczMzc3MH0.RXaqF8nRHLUNoDqGlQkORHpASRxcwJmyckBGxRWnkPg';
    const CORRECT_PIN = '1313';

    let currentPin = '';
    
    function updatePinDisplay() {
      document.getElementById('pin-dots').textContent = '•'.repeat(currentPin.length) || '';
    }

    function pressPin(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        updatePinDisplay();
        if (currentPin.length === 4) setTimeout(checkPin, 150);
      }
    }

    function clearPin() {
      currentPin = '';
      updatePinDisplay();
    }

    function checkPin() {
      if (currentPin === CORRECT_PIN) {
        document.getElementById('pin-modal').style.display = 'none';
        clearPin();
        loadShifts();
      } else {
        alert('Incorrect PIN');
        clearPin();
      }
    }

    function lockApp() {
      clearPin();
      document.getElementById('pin-modal').style.display = 'flex';
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') lockApp();
    });

    document.getElementById('date').valueAsDate = new Date();

    const headers = {
      'apikey': API_KEY,
      'Authorization': 'Bearer ' + API_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    async function loadShifts() {
      const container = document.getElementById('shift-list');
      try {
        const res = await fetch(`${API_URL}?select=*&order=created_at.desc`, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<p style="color:var(--muted)">No shifts logged yet.</p>';
          return;
        }

        container.innerHTML = data.map(shift => {
          const name = shift.sitterName || shift.sittername || 'Sitter';
          return `
            <div class="shift-card">
              <div class="shift-header">
                <span class="shift-name">${name}</span>
                <span class="shift-pay">$${shift.pay}</span>
              </div>
              <div class="shift-meta">
                <span>📅 ${shift.date}</span>
                <span>⏱ ${shift.hours} hrs</span>
              </div>
              ${shift.notes ? `<div class="shift-notes">${shift.notes}</div>` : ''}
              <div style="margin-top:6px;">
                <span class="status-badge ${shift.paid ? 'badge-paid' : 'badge-unpaid'}" onclick="togglePaid('${shift.id}', ${shift.paid})">
                  ${shift.paid ? '✓ Paid' : 'Unpaid (Tap to mark Paid)'}
                </span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:#ef4444">Connection Error: ${err.message}</p>`;
      }
    }

    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sitterVal = document.getElementById('sittername').value;
      const hoursVal = parseFloat(document.getElementById('hours').value);
      const payVal = parseFloat(document.getElementById('pay').value);
      const dateVal = document.getElementById('date').value;
      const notesVal = document.getElementById('notes').value;

      let payload = { date: dateVal, sittername: sitterVal, hours: hoursVal, pay: payVal, notes: notesVal, paid: false };

      try {
        let res = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify(payload) });
        if (!res.ok) {
          payload = { date: dateVal, sitterName: sitterVal, hours: hoursVal, pay: payVal, notes: notesVal, paid: false };
          res = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify(payload) });
        }

        if (!res.ok) throw new Error('Could not save shift.');
        
        document.getElementById('shift-form').reset();
        document.getElementById('date').valueAsDate = new Date();
        loadShifts();
      } catch (err) {
        alert('Save Failed: ' + err.message);
      }
    });

    async function togglePaid(id, currentStatus) {
      try {
        await fetch(`${API_URL}?id=eq.${id}`, {
          method: 'PATCH',
          headers,
          body: JSON.stringify({ paid: !currentStatus })
        });
        loadShifts();
      } catch (err) {
        alert('Update failed');
      }
    }
  </script>
</body>
</html>
