<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Family Sitter Tracker</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#131a22;
  --card2:#18212b;
  --text:#f4f7fa;
  --muted:#9aa8b5;
  --line:#263341;
  --accent:#6ee7b7;
  --danger:#fb7185;
  --warn:#fbbf24;
  --shadow:0 12px 30px #0008;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  background:var(--accent);
  color:#062218;
  font-weight:750;
  cursor:pointer;
  min-height:52px;
}

button.secondary{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--line);
}

button.danger{
  background:var(--danger);
  color:#300811;
}

button.small{
  padding:9px 12px;
  min-height:44px;
  font-size:14px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.wrap{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px 14px calc(90px + env(safe-area-inset-bottom));
}

.top{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.banner{
  height:155px;
  background:#111923 center/cover no-repeat;
}

.banner.noimg{
  height:90px;
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:16px;
  object-fit:cover;
  background:var(--card2);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-weight:800;
  flex:none;
}

.brand h1{
  font-size:20px;
  margin:0;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
}

nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:0 2px 12px;
  position:sticky;
  top:0;
  z-index:5;
  background:var(--bg);
  scrollbar-width:none;
}

nav::-webkit-scrollbar{
  display:none;
}

nav button{
  white-space:nowrap;
  flex:0 0 auto;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--line);
}

nav button.active{
  background:var(--accent);
  color:#062218;
  border-color:var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  min-width:0;
}

.stat{
  font-size:25px;
  font-weight:800;
}

.label{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
  flex-wrap:wrap;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.list{
  display:grid;
  gap:8px;
}

.item{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  min-width:0;
}

.person{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:0;
  flex:1 1 220px;
}

.person>div:last-child{
  min-width:0;
}

.person strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  background:#263341;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:none;
}

.pill{
  display:inline-block;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 8px;
  font-size:11px;
  color:var(--muted);
}

.pill.good{
  color:var(--accent);
  border-color:#2c6955;
}

.pill.warn{
  color:var(--warn);
}

.section-title{
  font-size:18px;
  margin:18px 0 9px;
}

.empty{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.filters select,
.filters input{
  width:auto;
  max-width:100%;
}

.field{
  display:grid;
  gap:7px;
  margin:12px 0;
}

.field label{
  font-size:14px;
  color:var(--muted);
}

.field-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

input,
select,
textarea{
  width:100%;
  max-width:100%;
  background:#0e141b;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 14px;
  outline:none;
  font-size:17px;
  min-height:54px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#4a7b69;
  box-shadow:0 0 0 2px #4a7b6933;
}

textarea{
  min-height:105px;
  resize:vertical;
  line-height:1.45;
}

input[type="checkbox"]{
  width:24px;
  height:24px;
  min-height:24px;
  padding:0;
  accent-color:var(--accent);
}

input[type="file"]{
  min-height:52px;
  padding:9px;
}

.modalbg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:#000b;
  z-index:20;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:
    8px
    8px
    max(8px,env(safe-area-inset-bottom));
  overflow:hidden;
  overscroll-behavior:contain;
}

.modal{
  width:min(720px,100%);
  max-height:calc(100vh - 16px);
  max-height:calc(
    100dvh -
    env(safe-area-inset-top,0px) -
    env(safe-area-inset-bottom,0px) -
    8px
  );
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

.modal-head{
  flex:none;
  background:var(--card);
  padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
}

.modal-head h2{
  margin:0;
}

.modal-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:4px 16px 16px;
}

.modal-actions{
  flex:none;
  background:var(--card);
  border-top:1px solid var(--line);
  padding:12px 16px calc(
    12px + env(safe-area-inset-bottom)
  );
}

.modal-actions .actions{
  width:100%;
}

.modal-actions .actions button{
  flex:1 1 150px;
}

.close{
  background:transparent;
  color:var(--muted);
  font-size:28px;
  padding:4px 10px;
  min-height:46px;
  min-width:46px;
  line-height:1;
}

.check{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  margin:7px 0;
  min-width:0;
}

.check input{
  width:24px;
  height:24px;
  margin-top:1px;
  flex:none;
}

.check>span{
  min-width:0;
  overflow-wrap:anywhere;
}

.paytotal{
  font-size:24px;
  font-weight:800;
  margin:12px 0;
}

.pin{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:
    20px
    20px
    calc(20px + env(safe-area-inset-bottom));
}

.pinbox{
  width:min(390px,100%);
  text-align:center;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:var(--shadow);
}

.pinlogo{
  width:90px;
  height:90px;
  border-radius:22px;
  object-fit:cover;
  background:var(--card2);
  margin:0 auto 14px;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:800;
}

.dots{
  font-size:28px;
  letter-spacing:8px;
  height:40px;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.keypad button{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--line);
  font-size:19px;
  min-height:58px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:
    calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:#f4f7fa;
  color:#0b0f14;
  padding:11px 15px;
  border-radius:999px;
  z-index:50;
  box-shadow:var(--shadow);
  font-weight:700;
  max-width:calc(100vw - 30px);
  text-align:center;
}

.file{
  padding:9px;
}

.notice{
  padding:11px;
  border-radius:11px;
  background:#10231d;
  border:1px solid #245943;
  color:#b9f7dc;
  font-size:13px;
}

.dangerbox{
  padding:11px;
  border-radius:11px;
  background:#2b1117;
  border:1px solid #6a2735;
  color:#fecdd3;
  font-size:13px;
}

/* =========================================================
   ADJUSTMENTS
   ========================================================= */

.adjust{
  display:grid;
  grid-template-columns:
    minmax(150px,.9fr)
    minmax(130px,.75fr)
    minmax(220px,1.4fr)
    48px;
  gap:9px;
  align-items:center;
  margin:10px 0;
}

.adjust select,
.adjust input{
  min-width:0;
}

.adjust-remove{
  width:48px!important;
  min-width:48px!important;
  max-width:48px!important;
  height:48px!important;
  min-height:48px!important;
  padding:0!important;
  display:grid!important;
  place-items:center;
  font-size:23px!important;
  line-height:1;
  border-radius:12px!important;
}

.breakdown{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
}

.line{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:3px 0;
  overflow-wrap:anywhere;
}

.line.total{
  font-weight:800;
  padding-top:7px;
  margin-top:4px;
  border-top:1px solid var(--line);
}

.method{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  margin:8px 0;
  min-width:0;
}

.method small{
  color:var(--muted);
  overflow-wrap:anywhere;
}

.payment-summary{
  padding:13px;
  border:1px solid var(--line);
  background:var(--card2);
  border-radius:13px;
  margin:10px 0;
}

.payment-summary .big{
  font-size:25px;
  font-weight:800;
}

.copy-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:9px;
}

.muted{
  color:var(--muted);
}

.money{
  white-space:nowrap;
}

.hidden{
  display:none!important;
}

.mobile-stack{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.sitter-card{
  min-width:0;
}

.sitter-actions{
  flex:0 0 auto;
}

.venmo-field{
  border:1px solid #2c6955;
  background:#10231d;
  border-radius:13px;
  padding:13px;
  margin:10px 0;
}

.venmo-field label{
  color:#b9f7dc;
}

.saved-check{
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

@media(max-width:649px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .brand{
    align-items:flex-start;
  }

  .brand>button{
    margin-left:auto!important;
  }

  .brand h1{
    font-size:18px;
  }

  .card{
    padding:12px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .sitter-card>.row{
    align-items:flex-start;
  }

  .sitter-actions{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .sitter-actions button{
    width:100%;
  }

  /*
    On phones, adjustment rows become:
    type + amount
    full-width note
    small square delete button
  */

  .adjust{
    grid-template-columns:
      minmax(0,1fr)
      minmax(0,1fr);
    gap:9px;
    padding:2px 0;
  }

  .adjust select,
  .adjust input{
    width:100%;
  }

  .adjust input.adjust-note{
    grid-column:1 / -1;
  }

  .adjust-remove{
    grid-column:1 / -1;
    justify-self:start;
  }

  .copy-grid{
    grid-template-columns:1fr;
  }

  .modalbg{
    padding-left:0;
    padding-right:0;
    padding-top:0;
  }

  .modal{
    width:100%;
    max-height:calc(100vh - 4px);
    max-height:calc(
      100dvh -
      env(safe-area-inset-top,0px) -
      env(safe-area-inset-bottom,0px) -
      2px
    );
    border-radius:20px 20px 0 0;
  }

  .modal-head{
    padding-top:12px;
  }

  .modal-actions .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .modal-actions .actions button{
    width:100%;
  }

  .modal-actions .actions button:last-child{
    grid-column:1 / -1;
  }
}

@media(min-width:650px){

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .banner{
    height:220px;
  }

  .modalbg{
    align-items:center;
    padding:20px;
  }

  .modal{
    max-height:92dvh;
    border-radius:20px;
  }
}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
'use strict';

const K={
  sitters:'fst_sitters',
  shifts:'fst_shifts',
  payments:'fst_payments',
  settings:'fst_settings'
};

const DEF={
  pin:'1313',
  familyName:'Favero Family',
  logo:'',
  banner:''
};

let state={
  sitters:[],
  shifts:[],
  payments:[],
  settings:{...DEF},
  tab:'dashboard',
  filter:'outstanding',
  sitterFilter:'all',
  from:'',
  to:''
};

const $=id=>document.getElementById(id);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const money=n=>'$'+Number(n||0).toFixed(2);

const round=n=>Math.round((Number(n)||0)*100)/100;

const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  "'":'&#39;',
  '"':'&quot;'
}[c]));

const initials=s=>String(s||'?')
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join('')
  .toUpperCase()||'?';

const today=()=>new Date().toISOString().slice(0,10);

const fmt=d=>d
  ?new Date(d+'T12:00:00').toLocaleDateString(undefined,{
    month:'short',
    day:'numeric',
    year:'numeric'
  })
  :'';

const shortFmt=d=>d
  ?new Date(d+'T12:00:00').toLocaleDateString(undefined,{
    month:'short',
    day:'numeric'
  })
  :'';

const dayName=d=>d
  ?new Date(d+'T12:00:00').toLocaleDateString(undefined,{
    weekday:'short'
  })
  :'';

const sitter=id=>state.sitters.find(s=>s.id===id);

function notify(msg){

  let t=$('toast');

  if(!t)return;

  t.textContent=msg;
  t.className='toast';

  clearTimeout(notify.t);

  notify.t=setTimeout(()=>{
    if(t)t.className='';
  },2600);
}

function normalize(){

  state.sitters=Array.isArray(state.sitters)
    ?state.sitters
    :[];

  state.shifts=Array.isArray(state.shifts)
    ?state.shifts
    :[];

  state.payments=Array.isArray(state.payments)
    ?state.payments
    :[];

  state.sitters=state.sitters.map(s=>({

    ...s,

    id:s.id||uid(),

    paymentMethods:
      Array.isArray(s.paymentMethods)
      ?s.paymentMethods
        .filter(m=>m)
        .map(m=>({
          ...m,
          id:m.id||uid(),
          label:String(m.label||'Other').trim(),
          handle:String(m.handle||'').trim()
        }))
      :[],

    avatar:s.avatar||'',

    archived:!!s.archived

  }));

  state.shifts=state.shifts.map(s=>{

    let adjustments=
      Array.isArray(s.adjustments)
      ?s.adjustments
      :[];

    if(
      !adjustments.length &&
      (Number(s.adjustment)||0)!==0
    ){

      adjustments=[{

        id:uid(),

        type:s.adjustmentType||'other',

        amount:Number(s.adjustment)||0,

        note:s.adjustmentNote||''

      }];
    }

    let base=round(
      Number(s.basePay)||
      round(
        (Number(s.hours)||0)*
        (Number(s.hourlyRate)||0)
      )
    );

    return {

      ...s,

      id:s.id||uid(),

      adjustments,

      totalPay:round(
        base+
        adjustments.reduce(
          (a,x)=>a+Number(x.amount||0),
          0
        )
      ),

      basePay:base
    };
  });
}

function save(){

  try{

    localStorage.setItem(
      K.sitters,
      JSON.stringify(state.sitters)
    );

    localStorage.setItem(
      K.shifts,
      JSON.stringify(state.shifts)
    );

    localStorage.setItem(
      K.payments,
      JSON.stringify(state.payments)
    );

    localStorage.setItem(
      K.settings,
      JSON.stringify(state.settings)
    );

    return true;

  }catch(e){

    notify(
      'Browser storage is full. Try smaller photos.'
    );

    return false;
  }
}

function load(){

  try{

    state.sitters=
      JSON.parse(
        localStorage.getItem(K.sitters)||'[]'
      );

    state.shifts=
      JSON.parse(
        localStorage.getItem(K.shifts)||'[]'
      );

    state.payments=
      JSON.parse(
        localStorage.getItem(K.payments)||'[]'
      );

    state.settings={
      ...DEF,
      ...JSON.parse(
        localStorage.getItem(K.settings)||'{}'
      )
    };

  }catch(e){

    state.sitters=[];
    state.shifts=[];
    state.payments=[];
    state.settings={...DEF};
  }

  normalize();
  save();
}

function hours(a,b){

  if(!a||!b)return 0;

  let [h,m]=a.split(':').map(Number);
  let [eh,em]=b.split(':').map(Number);

  let x=h*60+m;
  let y=eh*60+em;

  if(y<=x)y+=1440;

  return round((y-x)/60);
}

function adjustmentsTotal(s){

  return round(
    (s.adjustments||[])
      .reduce(
        (a,x)=>a+Number(x.amount||0),
        0
      )
  );
}

function total(s){

  return round(
    Number(s?.basePay||0)+
    adjustmentsTotal(s||{})
  );
}

function paid(s){
  return !!s.paymentId;
}

function outstandingFor(id){

  return round(
    state.shifts
      .filter(
        s=>s.sitterId===id&&!paid(s)
      )
      .reduce(
        (a,s)=>a+total(s),
        0
      )
  );
}

function unpaid(id){

  return state.shifts
    .filter(
      s=>s.sitterId===id&&!paid(s)
    )
    .sort(
      (a,b)=>b.date.localeCompare(a.date)
    );
}

function image(file,max=1000,quality=.78){

  return new Promise((res,rej)=>{

    if(!file)return res('');

    let r=new FileReader();

    r.onerror=rej;

    r.onload=()=>{

      let im=new Image();

      im.onload=()=>{

        let scale=Math.min(
          1,
          max/Math.max(im.width,im.height)
        );

        let c=document.createElement('canvas');

        c.width=Math.max(
          1,
          Math.round(im.width*scale)
        );

        c.height=Math.max(
          1,
          Math.round(im.height*scale)
        );

        c.getContext('2d').drawImage(
          im,
          0,
          0,
          c.width,
          c.height
        );

        res(
          c.toDataURL(
            'image/jpeg',
            quality
          )
        );
      };

      im.onerror=rej;
      im.src=r.result;
    };

    r.readAsDataURL(file);
  });
}

function pin(){

  document.getElementById('app').innerHTML=`

            [
              1,2,3,
              4,5,6,
              7,8,9,
              'C',0,'⌫'
            ]
            .map(k=>`
              <button onclick="pinKey('${k}')">
                ${k}
              </button>
            `)
            .join('')
          }

        </div>

      </div>

    </div>`;
}

function pinKey(k){

  if(k==='C'){
    pinbuf='';
  }else if(k==='⌫'){
    pinbuf=pinbuf.slice(0,-1);
  }else if(pinbuf.length<4){
    pinbuf+=k;
  }

  if(pinbuf.length===4){

    if(pinbuf===state.settings.pin){

      sessionStorage.setItem(
        'fst_unlocked',
        '1'
      );

      pinbuf='';
      render();
      return;

    }else{

      notify('Incorrect PIN');
      pinbuf='';
    }
  }

  if($('dots')){

    $('dots').textContent=
      pinbuf
        .padEnd(4,'○')
        .split('')
        .join(' ');
  }
}

function lock(){

  sessionStorage.removeItem(
    'fst_unlocked'
  );

  pinbuf='';
  render();
}

  let m=(methods||[])
    .find(
      x=>
        String(x.label)
          .toLowerCase()
        ===
        'venmo'
    );

  return m
    ?String(m.handle||'')
      .trim()
      .replace(/^@/,'')
    :'';
}

function setVenmoHandle(handle){

  handle=String(handle||'')
    .trim()
    .replace(/^@/,'');

  let index=
    window.editMethods.findIndex(
      m=>
        String(m.label)
          .toLowerCase()
        ===
        'venmo'
    );

  if(handle){

    if(index>=0){

      window.editMethods[index]={
        ...window.editMethods[index],
        handle
      };

    }else{

      window.editMethods.unshift({

        id:uid(),

        label:'Venmo',

        handle

      });
    }

  }else if(index>=0){

    window.editMethods.splice(
      index,
      1
    );
  }

  let status=$('venmoStatus');

  if(status){

    status.textContent=
      handle
      ?'✓ Venmo handle will be saved with this sitter'
      :'No Venmo handle saved';

    status.className=
      handle
      ?'saved-check'
      :'muted';
  }

  let methods=$('methods');

  if(methods){

    methods.innerHTML=
      paymentMethodsHTML(
        window.editMethods
      );
  }
}

  window.editMethods.push({

  $('methods').innerHTML=

function saveSitter(id){

  let name=
    $('sn')
      .value
      .trim();

  let rate=
    Number(
      $('sr').value
    );

  if(
    !name||
    !Number.isFinite(rate)||
    rate<0
  ){

    return notify(
      'Enter a valid name and rate'
    );
  }

  let venmoInput=
    $('venmoHandle')?.value||
    '';

  setVenmoHandle(
    venmoInput
  );

  let methods=
    JSON.parse(
      JSON.stringify(
        window.editMethods||[]
      )
    );

  if(id){

    let s=sitter(id);

    if(!s){

      return notify(
        'Sitter could not be found'
      );
    }

    Object.assign(s,{

      name,

      rate:round(rate),

      paymentMethods:methods,

      avatar:
        window.removeAvatar
        ?''
        :window.newAvatar

    });

  }else{

    state.sitters.push({

      id:uid(),

      name,

      rate:round(rate),

      paymentMethods:methods,

      avatar:
        window.removeAvatar
        ?''
        :window.newAvatar,

      archived:false

    });
  }

  if(!save()){

    return notify(
      'Could not save sitter. Try again.'
    );
  }

  let saved=
    sitter(id||state.sitters[state.sitters.length-1].id);

  let savedVenmo=
    getVenmoHandle(
      saved?.paymentMethods||[]
    );

  closeModal();
  render();

  notify(
    savedVenmo
    ?`Sitter saved — Venmo @${savedVenmo} saved`
    :'Sitter saved'
  );
}

  s.archived=!s.archived;

  save();
  render();
}

function adjSigned(a){

  let n=
    Math.abs(
      Number(a.amount)||0
    );

  return a.type==='deduction'
    ?-n
    :n;
}

function updatePreview(){

  let h=hours(
    $('sst').value,
    $('se').value
  );

  let base=round(
    h*
    (Number(
      $('srate').value
    )||0)
  );

  let adj=round(
    (window.shiftAdjustments||[])
      .reduce(
        (a,x)=>a+adjSigned(x),
        0
      )
  );

  $('preview').textContent=
    money(base+adj)+
    ` (${h}h)`;
}

function saveShift(id){

  let s=sitter(
    $('ss').value
  );

  if(!s){
    return notify(
      'Choose a sitter'
    );
  }

  let h=hours(
    $('sst').value,
    $('se').value
  );

  if(!h){

    return notify(
      'Enter valid start and end times'
    );
  }

  let rate=
    Number(
      $('srate').value
    );

  if(
    !Number.isFinite(rate)||
    rate<0
  ){

    return notify(
      'Enter a valid rate'
    );
  }

  let adj=
    (window.shiftAdjustments||[])
      .map(a=>({

        ...a,

        amount:
          round(
            adjSigned(a)
          ),

        typeLabel:
          a.type.charAt(0).toUpperCase()+
          a.type.slice(1)

      }))
      .filter(
        a=>a.amount!==0||
        a.note
      );

  let base=round(
    h*rate
  );

  let obj={

    id:id||uid(),

    sitterId:s.id,

    sitterName:s.name,

    date:$('sd').value,

    start:$('sst').value,

    end:$('se').value,

    hours:h,

    hourlyRate:round(rate),

    basePay:base,

    adjustments:adj,

    totalPay:round(
      base+
      adj.reduce(
        (a,x)=>a+x.amount,
        0
      )
    ),

    notes:
      $('snotes')
        .value
        .trim(),

    paymentId:id
      ?(
        state.shifts.find(
          x=>x.id===id
        )?.paymentId||
        null
      )
      :null
  };

  if(id){

    state.shifts[
      state.shifts.findIndex(
        x=>x.id===id
      )
    ]=obj;

  }else{

    state.shifts.push(obj);
  }

  save();
  closeModal();
  render();

  notify('Shift saved');
}

  state.shifts=

}

function selectedPayIds(){

  return [
    ...document.querySelectorAll(
      'input[name=payshift]:checked'
    )
  ].map(
    x=>x.value
  );
}

function selectedPayAmount(){

  return round(
    selectedPayIds()
      .reduce(
        (a,id)=>{

          let s=
            state.shifts.find(
              s=>s.id===id
            );

          return a+
            (s?total(s):0);

        },
        0
      )
  );
}

function selectedPayShifts(){

  let ids=selectedPayIds();

  return state.shifts
    .filter(
      s=>ids.includes(s.id)
    )
    .sort(
      (a,b)=>a.date.localeCompare(b.date)
    );
}

function adjustmentDescription(shifts){

  let parts=[];

  shifts.forEach(s=>{

    (s.adjustments||[]).forEach(a=>{

      if(!a.note)return;

      let label=
        a.type==='deduction'
        ?'deduction'
        :'reimbursement';

      parts.push(
        `${label}: ${a.note}`
      );
    });
  });

  return parts;
}

function autoPaymentNote(){

  let shifts=
    selectedPayShifts();

  if(!shifts.length){
    return 'Sitter payment';
  }

  let dateParts=
    shifts.map(s=>{

      let day=
        dayName(s.date);

      let date=
        shortFmt(s.date);

      return `${day} ${date}`;
    });

  let uniqueDates=[
    ...new Set(dateParts)
  ];

  let dateText=
    uniqueDates.join(', ');

  let adjustmentParts=
    adjustmentDescription(
      shifts
    );

  let shiftNotes=
    shifts
      .map(s=>String(s.notes||'').trim())
      .filter(Boolean);

  let note=
    `Childcare: ${dateText}`;

  if(adjustmentParts.length){

    note+=
      `; ${adjustmentParts.join(', ')}`;
  }

  if(shiftNotes.length){

    let uniqueNotes=[
      ...new Set(shiftNotes)
    ];

    note+=
      `; Notes: ${uniqueNotes.join('; ')}`;
  }

  if(note.length>240){

    note=
      note.slice(0,237)+
      '...';
  }

  return note;
}

function useAutoPaymentNote(){

  let input=$('pn');

  if(!input)return;

  paymentNoteManuallyEdited=false;

  input.value=

}

function setPreferredPaymentMethod(sid){

  let s=sitter(sid);

  let preferred=
    s?.paymentMethods?.[0];

  let select=$('pm');

  if(
    !select||
    !preferred
  ){
    return;
  }

  let value=
    String(preferred.label||'');

  let exists=
    [...select.options]
      .some(
        o=>
          o.value.toLowerCase()===
          value.toLowerCase()
      );

  if(exists){

    select.value=
      [...select.options]
        .find(
          o=>
            o.value.toLowerCase()===
            value.toLowerCase()
        )?.value||
      select.value;
  }
}

function renderPaymentSummary(){

  let box=$('payActions');

  if(!box)return;

  let s=
    sitter(
      $('ps')?.value
    );

  let amount=
    selectedPayAmount();

  let shifts=
    selectedPayShifts();

  if(!amount||!s){

    box.innerHTML='';
    return;
  }

  let v=
    venmoMethod(s);

  let isVenmo=
    $('pm')?.value==='Venmo';

  let note=
    $('pn')?.value.trim()||
    autoPaymentNote();

  box.innerHTML=`

    <div class="payment-summary">

      <div class="label">
        Payment Summary
      </div>

      <div class="big">
        ${money(amount)}
      </div>

      <div class="muted">
        To ${esc(s.name)}
      </div>

      ${
        v&&isVenmo

        ?`

          <div class="muted">
            Venmo:
            <strong>
              @${esc(
                String(v.handle)
                  .replace(/^@/,'')
              )}
            </strong>
          </div>

        `
        :''
      }

      <div class="muted">
        ${shifts.length}
        selected shift
        ${shifts.length===1?'':'s'}
      </div>

      <div
        class="muted"
        style="margin-top:6px"
      >
        ${esc(note)}
      </div>

      <div class="copy-grid">

        <button
          class="secondary small"
          onclick="copyPaymentAmount()"
        >
          Copy Amount
        </button>

        <button
          class="secondary small"
          onclick="copyPaymentNote()"
        >
          Copy Note
        </button>

        ${
          v

          ?`

            <button
              class="secondary small"
              onclick="copyVenmoHandle()"
            >
              Copy Venmo
            </button>

          `
          :`
            <button
              class="secondary small"
              disabled
            >
              No Venmo
            </button>
          `
        }

      </div>

    </div>
  `;
}

function venmoMethod(s){

  return (s?.paymentMethods||[])
    .find(
      m=>
        String(m.label)
          .toLowerCase()
        ===
        'venmo' &&
        String(m.handle||'').trim()
    );
}

function venmoUrl(
  handle,
  amount,
  note
){

  let h=
    String(handle||'')
      .trim()
      .replace(/^@/,'');

  let cleanNote=
    encodeURIComponent(
      note||
      'Sitter payment'
    );

  return `https://venmo.com/u/${encodeURIComponent(h)}?txn=pay&amount=${encodeURIComponent(amount.toFixed(2))}&note=${cleanNote}`;
}

function venmoDeepLink(
  handle,
  amount,
  note
){

  let h=
    String(handle||'')
      .trim()
      .replace(/^@/,'');

  return `venmo://paycharge?txn=pay&recipients=${encodeURIComponent(h)}&amount=${encodeURIComponent(amount.toFixed(2))}&note=${encodeURIComponent(note||'Sitter payment')}`;
}

function renderVenmoButton(){

  let box=$('payActions');

  if(!box)return;

  let s=
    sitter(
      $('ps')?.value
    );

  let amount=
    selectedPayAmount();

  let v=
    venmoMethod(s);

  let isVenmo=
    $('pm')?.value==='Venmo';

  let summary=
    box.querySelector(
      '.payment-summary'
    );

  if(!summary){

    if(
      amount&&
      s
    ){
      renderPaymentSummary();
      summary=
        box.querySelector(
          '.payment-summary'
        );
    }
  }

  if(!summary)return;

  let existing=
    summary.querySelector(
      '.venmo-actions'
    );

  if(existing){
    existing.remove();
  }

  if(
    !isVenmo||
    !amount||
    !v
  ){

    return;
  }

  let note=
    $('pn')?.value.trim()||
    autoPaymentNote();

  let div=
    document.createElement('div');

  div.className='venmo-actions';

  div.innerHTML=`

    <div
      class="notice"
      style="margin-top:10px"
    >

      <strong>
        Venmo is ready
      </strong>

      <br>

      Recipient:
      <strong>
        @${esc(
          String(v.handle)
            .replace(/^@/,'')
        )}
      </strong>

      <br>

      Amount:
      <strong>
        ${money(amount)}
      </strong>

      <br>

      Note:
      ${esc(note)}

    </div>

    <button
      style="
        width:100%;
        margin-top:8px
      "
      onclick="openVenmo()"
    >
      Open Venmo — ${money(amount)}
    </button>

    <button
      class="secondary small"
      style="
        width:100%;
        margin-top:7px
      "
      onclick="openVenmoWeb()"
    >
      Open Venmo Web
    </button>

  `;

  summary.appendChild(div);
}

function openVenmo(){

  let s=
    sitter(
      $('ps').value
    );

  let v=
    venmoMethod(s);

  let amount=
    selectedPayAmount();

  if(
    !v||
    !amount
  ){

    return notify(
      'Select shifts and add a Venmo handle for this sitter'
    );
  }

  let note=
    $('pn').value.trim()||
    autoPaymentNote();

  let nativeUrl=
    venmoDeepLink(
      v.handle,
      amount,
      note
    );

  let webUrl=
    venmoUrl(
      v.handle,
      amount,
      note
    );

  let started=
    Date.now();

  try{

    window.location.href=
      nativeUrl;

  }catch{

    window.open(
      webUrl,
      '_blank'
    );

    return;
  }

  setTimeout(()=>{

    if(
      document.visibilityState==='visible' &&
      Date.now()-started<
      2500
    ){

      try{
        window.location.href=
          webUrl;
      }catch{}
    }

  },1400);
}

function openVenmoWeb(){

  let s=
    sitter(
      $('ps').value
    );

  let v=
    venmoMethod(s);

  let amount=
    selectedPayAmount();

  if(
    !v||
    !amount
  ){

    return notify(
      'Select shifts and add a Venmo handle for this sitter'
    );
  }

  let note=
    $('pn').value.trim()||
    autoPaymentNote();

  let url=
    venmoUrl(
      v.handle,
      amount,
      note
    );

  window.open(
    url,
    '_blank',
    'noopener,noreferrer'
  );
}

async function copyText(text,success){

  try{

    if(
      navigator.clipboard&&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        text
      );

    }else{

      let ta=
        document.createElement('textarea');

      ta.value=text;
      ta.style.position='fixed';
      ta.style.opacity='0';

      document.body.appendChild(ta);

      ta.select();
      document.execCommand('copy');

      ta.remove();
    }

    notify(success);

  }catch{

    notify(
      'Could not copy. Please select it manually.'
    );
  }
}

function copyPaymentAmount(){

  let amount=
    selectedPayAmount();

  copyText(
    amount.toFixed(2),
    'Amount copied'
  );
}

function copyPaymentNote(){

  let note=
    $('pn')?.value.trim()||
    autoPaymentNote();

  copyText(
    note,
    'Payment note copied'
  );
}

function copyVenmoHandle(){

  let s=
    sitter(
      $('ps')?.value
    );

  let v=
    venmoMethod(s);

  if(!v){

    return notify(
      'No Venmo handle saved for this sitter'
    );
  }

  copyText(
    String(v.handle)
      .replace(/^@/,''),
    'Venmo handle copied'
  );
}

function recordPayment(){

  let ids=
    selectedPayIds();

  if(!ids.length){

    return notify(
      'Select at least one shift'
    );
  }

  let sh=
    state.shifts.filter(
      s=>ids.includes(s.id)
    );

  let amount=round(
    sh.reduce(
      (a,s)=>a+total(s),
      0
    )
  );

  let sid=
    $('ps').value;

  let note=
    $('pn').value.trim()||
    autoPaymentNote();

  let p={

    id:uid(),

    sitterId:sid,

    sitterName:
      sitter(sid)?.name||
      '',

    date:
      $('pd').value,

    amount,

    method:
      $('pm').value,

    note,

    shiftIds:ids

  };

  state.payments.push(p);

  sh.forEach(
    s=>s.paymentId=p.id
  );

  save();

  closeModal();
  render();

  notify(
    'Payment recorded'
  );
}

function showModal(html){

  closeModal();

  let d=
    document.createElement('div');

  d.id='modalRoot';
  d.className='modalbg';

  d.innerHTML=
    `<div
      class="modal"
      role="dialog"
      aria-modal="true"
    >
      ${html}
    </div>`;

  document.body.appendChild(d);

  document.body.style.overflow='hidden';

  d.addEventListener(
    'click',
    e=>{

      if(e.target===d){
        closeModal();
      }

    }
  );

  setTimeout(()=>{

    let first=
      d.querySelector(
        'input:not([type=file]),select,textarea'
      );

    if(first){

      try{

        first.focus({
          preventScroll:true
        });

      }catch{}
    }

  },100);
}

function closeModal(){

  document.getElementById(
    'modalRoot'
  )?.remove();

  document.body.style.overflow='';
}

function exportData(){

  let blob=
    new Blob(
      [
        JSON.stringify(
          {
            version:4,
            sitters:state.sitters,
            shifts:state.shifts,
            payments:state.payments,
            settings:state.settings
          },
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  let a=
    document.createElement('a');

  a.href=
    URL.createObjectURL(blob);

  a.download=
    'family-sitter-tracker-backup-'+
    today()+
    '.json';

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(a.href),
    1000
  );
}

function importData(e){

  let f=
    e.target.files[0];

  if(!f)return;

  let r=
    new FileReader();

  r.onload=()=>{

    try{

      let d=
        JSON.parse(
          r.result
        );

      if(
        !Array.isArray(d.sitters)||
        !Array.isArray(d.shifts)||
        !Array.isArray(d.payments)
      ){

        throw 0;
      }

      if(
        !confirm(
          'Replace all current tracker data with this backup?'
        )
      ){
        return;
      }

      state.sitters=d.sitters;
      state.shifts=d.shifts;
      state.payments=d.payments;

      state.settings={
        ...DEF,
        ...(d.settings||{})
      };

      normalize();
      save();
      render();

      notify(
        'Backup imported'
      );

    }catch{

      notify(
        'Invalid backup file'
      );
    }
  };

  r.readAsText(f);
}

function resetAll(){

  if(
    !confirm(
      'Clear ALL tracker data from this browser?'
    )
  ){
    return;
  }

  Object.values(K).forEach(
    k=>
      localStorage.removeItem(k)
  );

  sessionStorage.removeItem(
    'fst_unlocked'
  );

  location.reload();
}

load();

if(
  !sessionStorage.getItem(
    'fst_unlocked'
  )
){

  pin();

}else{

  render();
}
</script>
