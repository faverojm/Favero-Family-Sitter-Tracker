<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIN Landing Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container simulating a mobile screen aspect ratio */
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* --- TOP HALF: HERO / LANDING IMAGE --- */
    .hero-section {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #2b5876, #4e4376);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.85;
    }

    .hero-overlay {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #ffffff;
      padding: 1rem;
    }

    .hero-overlay h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero-overlay p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* --- BOTTOM HALF: PIN PAD AREA --- */
    .pin-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background-color: #ffffff;
    }

    /* PIN Dots Display */
    .pin-display {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #ccc;
      transition: all 0.15s ease-in-out;
    }

    .dot.filled {
      background-color: #3182ce;
      border-color: #3182ce;
      transform: scale(1.1);
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 280px;
      margin-bottom: 0.5rem;
    }

    .key {
      height: 56px;
      border-radius: 50%;
      border: none;
      background-color: #f0f4f8;
      color: #2d3748;
      font-size: 1.35rem;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background-color 0.1s, transform 0.05s;
    }

    .key:active {
      background-color: #cbd5e0;
      transform: scale(0.95);
    }

    .key.action-key {
      background-color: transparent;
      font-size: 1.1rem;
      color: #4a5568;
    }

    .key.action-key:active {
      background-color: #edf2f7;
    }

    .key.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .key svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top 50%: Hero Image & Welcome Header -->
    <div class="hero-section">
      <!-- Replace src with your landing page image URL -->
      <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=800&q=80" alt="Landing Header" />
      <div class="hero-overlay">
        <h1>Welcome Back</h1>
        <p>Enter your PIN to continue</p>
      </div>
    </div>

    <!-- Bottom 50%: PIN Input & Keypad -->
    <div class="pin-section">
      <!-- Masked PIN Indicators -->
      <div class="pin-display">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
      </div>

      <!-- 3x4 Touch Keypad -->
      <div class="keypad">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        
        <button class="key action-key" onclick="clearAll()">C</button>
        <button class="key" onclick="pressKey('0')">0</button>
        
        <!-- Back Arrow Button -->
        <button class="key action-key disabled" id="back-btn" onclick="pressBack()" aria-label="Delete last digit">
          <svg viewBox="0 0 24 24">
            <path d="M22,3H7C6.31,3 5.77,3.35 5.41,3.88L0,12L5.41,20.11C5.77,20.64 6.31,21 7,21H22A2,2 0 0,0 24,19V5A2,2 0 0,0 22,3M19,15.59L17.59,17L14,13.41L10.41,17L9,15.59L12.59,12L9,8.41L10.41,7L14,10.59L17.59,7L19,8.41L15.41,12L19,15.59Z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentPin = [];
    const maxLen = 4;

    function pressKey(num) {
      if (currentPin.length < maxLen) {
        currentPin.push(num);
        updateUI();

        // Check if PIN is fully entered
        if (currentPin.length === maxLen) {
          setTimeout(() => {
            alert("PIN entered: " + currentPin.join(""));
          }, 100);
        }
      }
    }

    function pressBack() {
      if (currentPin.length > 0) {
        currentPin.pop();
        updateUI();
      }
    }

    function clearAll() {
      currentPin = [];
      updateUI();
    }

    function updateUI() {
      // Update dot indicators
      for (let i = 0; i < maxLen; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentPin.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }
      }

      // Toggle back arrow enabled/disabled state
      const backBtn = document.getElementById("back-btn");
      if (currentPin.length > 0) {
        backBtn.classList.remove("disabled");
      } else {
        backBtn.classList.add("disabled");
      }
    }
  </script>
</body>
</html>
