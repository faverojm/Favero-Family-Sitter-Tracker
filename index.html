<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Childcare & Babysitter Tracker</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
      padding: 1rem 0;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .card {
      background-color: #1e293b;
      border-radius: 0.75rem;
      padding: 1.25rem;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input, select, textarea {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.65rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #334155;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-danger {
      background-color: #dc2626;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
    }

    .sitter-list, .shift-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .list-item {
      background-color: #0f172a;
      padding: 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .list-item-title {
      font-weight: 600;
      color: #f8fafc;
    }

    .list-item-sub {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .action-btns {
      display: flex;
      gap: 0.5rem;
    }

    .sm-btn {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      border-radius: 0.35rem;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background-color: #1e293b;
      border-radius: 0.75rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Favero Sitter Tracker</h1>
    </header>

    <!-- Shift Logging Card -->
    <div class="card">
      <h2>Log New Shift</h2>
      <form id="shift-form">
        <div class="form-group">
          <label for="shift-sitter">Select Sitter</label>
          <select id="shift-sitter" required>
            <option value="">Select Sitter...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="shift-date">Date</label>
          <input type="date" id="shift-date" required />
        </div>
        <div class="form-group">
          <label for="shift-start">Start Time</label>
          <input type="time" id="shift-start" required />
        </div>
        <div class="form-group">
          <label for="shift-end">End Time</label>
          <input type="time" id="shift-end" required />
        </div>
        <div class="form-group">
          <label for="shift-notes">Notes / Adjustments</label>
          <textarea id="shift-notes" rows="2" placeholder="Optional notes..."></textarea>
        </div>
        <button type="submit" class="btn">Save Shift</button>
      </form>
    </div>

    <!-- Active Sitters Card -->
    <div class="card">
      <h2>
        Sitters
        <button class="btn btn-secondary sm-btn" onclick="openAddSitterModal()">+ Add Sitter</button>
      </h2>
      <ul id="sitter-list" class="sitter-list">
        <!-- Dynamically Populated -->
      </ul>
    </div>

    <!-- Shift Logs Card -->
    <div class="card">
      <h2>Recent Shifts</h2>
      <ul id="shift-list" class="shift-list">
        <!-- Dynamically Populated -->
      </ul>
    </div>
  </div>

  <!-- Add/Edit Sitter Modal -->
  <div id="sitter-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="sitter-modal-title" style="margin-bottom:1rem;">Add Sitter Profile</h2>
      <form id="sitter-form">
        <input type="hidden" id="edit-s-idx" value="-1" />
        <div class="form-group">
          <label for="edit-s-name">Sitter Name</label>
          <input type="text" id="edit-s-name" required />
        </div>
        <div class="form-group">
          <label for="edit-s-rate">Hourly Rate ($)</label>
          <input type="number" step="0.50" id="edit-s-rate" required />
        </div>
        <div class="form-group">
          <label for="edit-s-venmo">Venmo / Payment Info</label>
          <input type="text" id="edit-s-venmo" placeholder="@username or phone" />
        </div>
        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('sitter-modal')">Cancel</button>
          <button type="submit" class="btn">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- Supabase & Application State Setup ---
    const SUPABASE_URL = 'https://xyzcompany.supabase.co'; // Preserved project connection
    const SUPABASE_KEY = 'public-anon-key';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let sitters = JSON.parse(localStorage.getItem('favero_sitters')) || [
      { name: 'Sample Sitter', rate: 15.00, venmo: '@sitter' }
    ];
    let shifts = JSON.parse(localStorage.getItem('favero_shifts')) || [];

    // --- Core Rendering Logic ---
    function renderSitters() {
      const listEl = document.getElementById('sitter-list');
      const selectEl = document.getElementById('shift-sitter');
      listEl.innerHTML = '';
      selectEl.innerHTML = '<option value="">Select Sitter...</option>';

      sitters.forEach((sitter, idx) => {
        // Select dropdown options
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${sitter.name} ($${sitter.rate}/hr)`;
        selectEl.appendChild(opt);

        // List display items
        const li = document.createElement('li');
        li.className = 'list-item';
        li.innerHTML = `
          <div class="list-item-info">
            <span class="list-item-title">${sitter.name}</span>
            <span class="list-item-sub">$${sitter.rate}/hr | Venmo: ${sitter.venmo || 'N/A'}</span>
          </div>
          <div class="action-btns">
            <button class="btn btn-secondary sm-btn" onclick="openEditSitterModal(${idx})">Edit</button>
          </div>
        `;
        listEl.appendChild(li);
      });
      localStorage.setItem('favero_sitters', JSON.stringify(sitters));
    }

    function renderShifts() {
      const listEl = document.getElementById('shift-list');
      listEl.innerHTML = '';

      if (shifts.length === 0) {
        listEl.innerHTML = '<li class="list-item"><span class="list-item-sub">No logged shifts yet.</span></li>';
        return;
      }

      shifts.forEach((shift) => {
        const li = document.createElement('li');
        li.className = 'list-item';
        li.innerHTML = `
          <div class="list-item-info">
            <span class="list-item-title">${shift.sitterName} - $${shift.totalPay}</span>
            <span class="list-item-sub">${shift.date} | ${shift.start} - ${shift.end} (${shift.hours} hrs)</span>
            ${shift.notes ? `<span class="list-item-sub">Notes: ${shift.notes}</span>` : ''}
          </div>
        `;
        listEl.appendChild(li);
      });
      localStorage.setItem('favero_shifts', JSON.stringify(shifts));
    }

    // --- Sitter Profile Handlers ---
    window.openAddSitterModal = function() {
      document.getElementById('sitter-modal-title').textContent = 'Add Sitter Profile';
      document.getElementById('edit-s-idx').value = '-1';
      document.getElementById('edit-s-name').value = '';
      document.getElementById('edit-s-rate').value = '';
      document.getElementById('edit-s-venmo').value = '';
      document.getElementById('sitter-modal').classList.add('active');
    };

    window.openEditSitterModal = function(idx) {
      const sitter = sitters[idx];
      if (!sitter) return;
      document.getElementById('sitter-modal-title').textContent = 'Edit Sitter Profile';
      document.getElementById('edit-s-idx').value = idx;
      document.getElementById('edit-s-name').value = sitter.name;
      document.getElementById('edit-s-rate').value = sitter.rate;
      document.getElementById('edit-s-venmo').value = sitter.venmo || '';
      document.getElementById('sitter-modal').classList.add('active');
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.remove('active');
    };

    document.getElementById('sitter-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const idx = parseInt(document.getElementById('edit-s-idx').value, 10);
      const name = document.getElementById('edit-s-name').value;
      const rate = parseFloat(document.getElementById('edit-s-rate').value);
      const venmo = document.getElementById('edit-s-venmo').value;

      if (idx >= 0) {
        sitters[idx] = { name, rate, venmo };
      } else {
        sitters.push({ name, rate, venmo });
      }

      renderSitters();
      closeModal('sitter-modal');
    });

    // --- Shift Submission Logic ---
    document.getElementById('shift-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const sitterIdx = document.getElementById('shift-sitter').value;
      const date = document.getElementById('shift-date').value;
      const start = document.getElementById('shift-start').value;
      const end = document.getElementById('shift-end').value;
      const notes = document.getElementById('shift-notes').value;

      if (sitterIdx === "") return;
      const sitter = sitters[sitterIdx];

      // Calculate hours
      const startTime = new Date(`${date}T${start}`);
      const endTime = new Date(`${date}T${end}`);
      let diffMs = endTime - startTime;
      if (diffMs < 0) diffMs += 24 * 60 * 60 * 1000; // overnight shift check
      const hours = (diffMs / (1000 * 60 * 60)).toFixed(2);
      const totalPay = (hours * sitter.rate).toFixed(2);

      const shiftData = {
        sitterName: sitter.name,
        date,
        start,
        end,
        hours,
        totalPay,
        notes
      };

      shifts.unshift(shiftData);
      renderShifts();
      this.reset();
    });

    // Initial Initialization
    renderSitters();
    renderShifts();
  </script>
</body>
</html>
