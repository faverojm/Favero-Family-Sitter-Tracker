  <script>
    // Configuration
    const SUPABASE_URL = 'https://mvwmpoofylsrmkdfzat.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12d21wb29meWxzcmhta2RmemF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTc3NzAsImV4cCI6MjEwNTczMzc3MH0.RXaqF8nRHLUNoDqGlQkORHpASRxcwJmyckBGxRWnkPg';
    const CORRECT_PIN = '1313';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // PIN State
    let currentPin = '';
    
    function updatePinDisplay() {
      document.getElementById('pin-dots').textContent = '•'.repeat(currentPin.length) || '';
    }

    function pressPin(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        updatePinDisplay();
        if (currentPin.length === 4) setTimeout(checkPin, 150);
      }
    }

    function clearPin() {
      currentPin = '';
      updatePinDisplay();
    }

    function checkPin() {
      if (currentPin === CORRECT_PIN) {
        document.getElementById('pin-modal').style.display = 'none';
        clearPin();
        loadShifts();
      } else {
        alert('Incorrect PIN');
        clearPin();
      }
    }

    function lockApp() {
      clearPin();
      document.getElementById('pin-modal').style.display = 'flex';
    }

    // Auto-lock when switching apps
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        lockApp();
      }
    });

    // Default Date to Today
    document.getElementById('date').valueAsDate = new Date();

    // Data Actions
    async function loadShifts() {
      const { data, error } = await db.from('shifts').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('shift-list');
      
      if (error) {
        console.error(error);
        container.innerHTML = `<p style="color:#ef4444">Error loading shifts: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--muted)">No shifts logged yet.</p>';
        return;
      }

      container.innerHTML = data.map(shift => {
        const name = shift.sitterName || shift.sittername || 'Sitter';
        return `
          <div class="shift-card">
            <div class="shift-header">
              <span class="shift-name">${name}</span>
              <span class="shift-pay">$${shift.pay}</span>
            </div>
            <div class="shift-meta">
              <span>📅 ${shift.date}</span>
              <span>⏱ ${shift.hours} hrs</span>
            </div>
            ${shift.notes ? `<div class="shift-notes">${shift.notes}</div>` : ''}
            <div style="margin-top:6px;">
              <span class="status-badge ${shift.paid ? 'badge-paid' : 'badge-unpaid'}" onclick="togglePaid('${shift.id}', ${shift.paid})">
                ${shift.paid ? '✓ Paid' : 'Unpaid (Tap to mark Paid)'}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sitterVal = document.getElementById('sittername').value;
      const hoursVal = parseFloat(document.getElementById('hours').value);
      const payVal = parseFloat(document.getElementById('pay').value);
      
      // Try inserting with lowercase sittername first
      let res = await db.from('shifts').insert([{
        date: document.getElementById('date').value,
        sittername: sitterVal,
        hours: hoursVal,
        pay: payVal,
        notes: document.getElementById('notes').value,
        paid: false
      }]);

      // If database expected capitalized sitterName, retry automatically
      if (res.error) {
        res = await db.from('shifts').insert([{
          date: document.getElementById('date').value,
          sitterName: sitterVal,
          hours: hoursVal,
          pay: payVal,
          notes: document.getElementById('notes').value,
          paid: false
        }]);
      }

      if (res.error) {
        alert('Save Error: ' + res.error.message);
      } else {
        document.getElementById('shift-form').reset();
        document.getElementById('date').valueAsDate = new Date();
        loadShifts();
      }
    });

    async function togglePaid(id, currentStatus) {
      const { error } = await db.from('shifts').update({ paid: !currentStatus }).eq('id', id);
      if (!error) loadShifts();
    }
  </script>
