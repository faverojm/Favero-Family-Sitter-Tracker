<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Sitter Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    /* Custom Banner Header */
    .banner-container {
      position: relative; width: 100%; height: 140px; background: #252525;
      background-size: cover; background-position: center; border-bottom: 1px solid var(--border);
    }
    .banner-overlay {
      position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(18,18,18,0.9));
      display: flex; justify-content: space-between; align-items: flex-end; padding: 16px;
    }
    .banner-title { font-size: 1.5rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .header-btns { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: rgba(30,30,30,0.85); border: 1px solid var(--border); color: #fff; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }

    .main-content { padding: 16px; }

    /* PIN Modal */
    #pin-modal {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .pin-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; }
    .pin-display { font-size: 2rem; letter-spacing: 12px; margin-bottom: 24px; height: 40px; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 280px; }
    .pin-btn {
      aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 1.5rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .pin-btn:active { background: var(--border); }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 8888; display: none; justify-content: center; align-items: center; padding: 16px; }
    .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 480px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], select, textarea {
      width: 100%; background: #2a2a2a; border: 1px solid var(--border); color: #fff;
      padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; outline: none; appearance: none; -webkit-appearance: none;
    }
    input[type="file"] { display: none; }
    .file-upload-btn {
      display: inline-block; width: 100%; text-align: center; background: #2a2a2a; border: 1px dashed var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-weight: 500;
    }

    button.submit-btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 8px;
    }

    /* Shift Card Layout */
    .shift-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .shift-top-row { display: flex; justify-content: space-between; align-items: center; }
    .select-label {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem;
      color: var(--muted); cursor: pointer; user-select: none; font-weight: 500;
    }
    .shift-select {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 4px;
      background: #2a2a2a; cursor: pointer; display: grid; place-content: center;
    }
    .shift-select:checked { background: var(--accent); border-color: var(--accent); }
    .shift-select:checked::before { content: "✓"; color: white; font-size: 12px; font-weight: bold; }

    .shift-body { min-width: 0; }
    .shift-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .shift-name-area { display: flex; align-items: center; gap: 8px; }
    .sitter-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #374151; flex-shrink: 0; }
    .shift-name { font-weight: 600; font-size: 1.05rem; }
    .shift-pay { font-weight: 700; color: var(--green); font-size: 1.15rem; }
    .shift-meta { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2px; }
    .shift-notes { font-size: 0.85rem; color: #d1d5db; margin-top: 6px; }

    .pay-links { display: flex; gap: 8px; }
    .pay-link { font-size: 0.75rem; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-weight: 600; text-align: center; display: inline-block; }
    .venmo-btn { background: #008CFF; color: white; }
    .paypal-btn { background: #003087; color: white; }

    /* Multi Pay Toolbar */
    .batch-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1a2332; border-top: 1px solid var(--accent);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 7000;
      transform: translateY(100%); transition: transform 0.2s ease;
    }
    .batch-bar.visible { transform: translateY(0); }
    .batch-bar-top { display: flex; justify-content: space-between; align-items: center; }
    .batch-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <!-- PIN Modal -->
  <div id="pin-modal">
    <div class="pin-title">Enter Favero Family PIN</div>
    <div class="pin-display" id="pin-dots">••••</div>
    <div class="pin-pad">
      <div class="pin-btn" onclick="pressPin('1')">1</div>
      <div class="pin-btn" onclick="pressPin('2')">2</div>
      <div class="pin-btn" onclick="pressPin('3')">3</div>
      <div class="pin-btn" onclick="pressPin('4')">4</div>
      <div class="pin-btn" onclick="pressPin('5')">5</div>
      <div class="pin-btn" onclick="pressPin('6')">6</div>
      <div class="pin-btn" onclick="pressPin('7')">7</div>
      <div class="pin-btn" onclick="pressPin('8')">8</div>
      <div class="pin-btn" onclick="pressPin('9')">9</div>
      <div class="pin-btn" onclick="clearPin()">C</div>
      <div class="pin-btn" onclick="pressPin('0')">0</div>
      <div class="pin-btn" onclick="checkPin()">✓</div>
    </div>
  </div>

  <!-- Header Banner -->
  <div class="banner-container" id="app-banner">
    <div class="banner-overlay">
      <div class="banner-title">Sitter Tracker</div>
      <div class="header-btns">
        <button class="icon-btn" onclick="openSittersModal()" title="Manage Sitters">👤</button>
        <button class="icon-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
        <button class="icon-btn" onclick="lockApp()" title="Lock">🔒</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <!-- Shift Entry Card -->
    <div class="card">
      <form id="shift-form">
        <!-- STEP 1: Select Sitter First -->
        <div class="form-group">
          <label style="font-size: 0.9rem; font-weight: 700; color: var(--accent);">1. Choose Sitter</label>
          <select id="sitter-select" onchange="autoCalcPay()" required>
            <option value="">Select Sitter...</option>
          </select>
        </div>

        <!-- STEP 2: Select Date & Times -->
        <label style="font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-top: 14px;">2. Shift Details</label>
        
        <div class="form-row" style="margin-top: 6px;">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" id="start-time" value="18:00" onchange="autoCalcPay()" required>
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" id="end-time" value="22:30" onchange="autoCalcPay()" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Calculated Hours</label>
            <input type="number" step="0.1" id="hours" placeholder="4.5" required readonly>
          </div>
          <div class="form-group">
            <label>Total Pay ($)</label>
            <input type="number" step="1" id="pay" placeholder="90" required>
          </div>
        </div>

        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea id="notes" rows="2" placeholder="Date night, tip included, etc."></textarea>
        </div>
        <button type="submit" id="submit-shift-btn" class="submit-btn">Log Shift</button>
      </form>
    </div>

    <h2 style="font-size: 1.1rem; margin-bottom: 12px; color: var(--muted);">Shift History</h2>
    <div id="shift-list">Loading shifts...</div>
  </div>

  <!-- Multi-Shift Batch Toolbar with Payment Links -->
  <div class="batch-bar" id="batch-bar">
    <div class="batch-bar-top">
      <div>
        <span id="batch-count">0</span> shifts selected
        <strong id="batch-total" style="color:var(--green); margin-left: 8px;">$0</strong>
      </div>
      <button onclick="batchMarkPaid()" style="background:var(--green); color:#fff; border:none; padding:8px 14px; border-radius:6px; font-weight:600; font-size:0.85rem;">Mark Paid</button>
    </div>
    <div class="batch-actions" id="batch-pay-links"></div>
  </div>

  <!-- Sitters Management Modal -->
  <div class="modal" id="sitters-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size:1.1rem;">Manage Sitter Profiles</h3>
        <button onclick="closeModal('sitters-modal')" style="background:none; border:none; color:var(--muted); font-size:1.2rem;">✕</button>
      </div>

      <form id="sitter-form" style="margin-bottom: 20px;">
        <div class="form-group">
          <label>Sitter Full Name</label>
          <input type="text" id="s-name" required placeholder="e.g. Sarah Jenkins">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Hourly Rate ($)</label>
            <input type="number" id="s-rate" value="20" required>
          </div>
          <div class="form-group">
            <label>Photo / Avatar Image</label>
            <label class="file-upload-btn" for="s-avatar-file" id="s-avatar-label">📷 Upload Photo</label>
            <input type="file" id="s-avatar-file" accept="image/*" onchange="handleImageFile(this, 's-avatar-base64', 's-avatar-label')">
            <input type="hidden" id="s-avatar-base64">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Venmo Handle</label>
            <input type="text" id="s-venmo" placeholder="@username">
          </div>
          <div class="form-group">
            <label>PayPal Link / Handle</label>
            <input type="text" id="s-paypal" placeholder="paypal.me/username">
          </div>
        </div>
        <button type="submit" class="submit-btn" style="background:#2563eb;">Save Sitter Profile</button>
      </form>

      <h4 style="font-size:0.9rem; color:var(--muted); margin-bottom:8px;">Saved Sitters</h4>
      <div id="sitter-list-container">Loading...</div>
    </div>
  </div>

  <!-- App Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size:1.1rem;">App & Banner Settings</h3>
        <button onclick="closeModal('settings-modal')" style="background:none; border:none; color:var(--muted); font-size:1.2rem;">✕</button>
      </div>
      <form id="settings-form">
        <div class="form-group">
          <label>Upload Banner Image from Photo Library / Files</label>
          <label class="file-upload-btn" for="banner-file" id="banner-file-label">🖼️ Choose Header Image</label>
          <input type="file" id="banner-file" accept="image/*" onchange="handleImageFile(this, 'banner-base64', 'banner-file-label')">
          <input type="hidden" id="banner-base64">
        </div>
        <button type="submit" class="submit-btn">Save Banner</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://mvwmpoofylsrhmkdfzat.supabase.co/rest/v1/shifts';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12d21wb29meWxzcmhta2RmemF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTc3NzAsImV4cCI6MjEwNTczMzc3MH0.RXaqF8nRHLUNoDqGlQkORHpASRxcwJmyckBGxRWnkPg';
    const CORRECT_PIN = '1313';

    let sittersCache = [];
    let shiftsCache = [];
    let selectedShifts = new Map();
    let currentPin = '';

    const headers = {
      'apikey': API_KEY,
      'Authorization': 'Bearer ' + API_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    function handleImageFile(input, hiddenInputId, labelId) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById(hiddenInputId).value = e.target.result;
          document.getElementById(labelId).textContent = "✓ Image Loaded";
        };
        reader.readAsDataURL(file);
      }
    }

    function getStoredSitters() { return JSON.parse(localStorage.getItem('favero_sitters') || '[]'); }
    function saveStoredSitters(arr) {
      localStorage.setItem('favero_sitters', JSON.stringify(arr));
      sittersCache = arr;
      updateSitterDropdown();
    }

    function pressPin(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        document.getElementById('pin-dots').textContent = '•'.repeat(currentPin.length);
        if (currentPin.length === 4) setTimeout(checkPin, 150);
      }
    }
    function clearPin() { currentPin = ''; document.getElementById('pin-dots').textContent = ''; }
    function checkPin() {
      if (currentPin === CORRECT_PIN) {
        document.getElementById('pin-modal').style.display = 'none';
        clearPin();
        initData();
      } else {
        alert('Incorrect PIN');
        clearPin();
      }
    }
    function lockApp() { clearPin(); document.getElementById('pin-modal').style.display = 'flex'; }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') lockApp(); });

    function openSittersModal() { document.getElementById('sitters-modal').style.display = 'flex'; renderSittersList(); }
    function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    document.getElementById('date').valueAsDate = new Date();

    function initData() {
      sittersCache = getStoredSitters();
      updateSitterDropdown();
      loadBanner();
      loadShifts();
      autoCalcPay();
    }

    function loadBanner() {
      const savedBanner = localStorage.getItem('favero_banner');
      if (savedBanner) {
        document.getElementById('app-banner').style.backgroundImage = `url('${savedBanner}')`;
      }
    }

    document.getElementById('settings-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const banner_data = document.getElementById('banner-base64').value;
      if (banner_data) {
        localStorage.setItem('favero_banner', banner_data);
        loadBanner();
      }
      closeModal('settings-modal');
    });

    function updateSitterDropdown() {
      const sel = document.getElementById('sitter-select');
      sel.innerHTML = '<option value="">Select Sitter...</option>' + 
        sittersCache.map(s => `<option value="${s.name}" data-rate="${s.rate}">${s.name} ($${s.rate}/hr)</option>`).join('');
    }

    function renderSittersList() {
      const container = document.getElementById('sitter-list-container');
      if (!sittersCache.length) { container.innerHTML = '<p style="color:var(--muted)">No sitters added yet.</p>'; return; }
      
      container.innerHTML = sittersCache.map((s, idx) => `
        <div style="background:#2a2a2a; padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${s.avatar ? `<img src="${s.avatar}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">` : ''}
            <div>
              <strong>${s.name}</strong> <span style="color:var(--green)">$${s.rate}/hr</span>
              <div style="font-size:0.8rem; color:var(--muted);">Venmo: ${s.venmo || 'N/A'} | PayPal: ${s.paypal || 'N/A'}</div>
            </div>
          </div>
          <button onclick="deleteSitter(${idx})" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:0.75rem;">Delete</button>
        </div>
      `).join('');
    }

    document.getElementById('sitter-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newSitter = {
        name: document.getElementById('s-name').value,
        rate: parseFloat(document.getElementById('s-rate').value),
        avatar: document.getElementById('s-avatar-base64').value,
        venmo: document.getElementById('s-venmo').value,
        paypal: document.getElementById('s-paypal').value
      };
      const list = getStoredSitters();
      list.push(newSitter);
      saveStoredSitters(list);
      document.getElementById('sitter-form').reset();
      document.getElementById('s-avatar-label').textContent = "📷 Upload Photo";
      renderSittersList();
    });

    function deleteSitter(idx) {
      if (confirm('Delete sitter profile?')) {
        const list = getStoredSitters();
        list.splice(idx, 1);
        saveStoredSitters(list);
        renderSittersList();
      }
    }

    function autoCalcPay() {
      const start = document.getElementById('start-time').value;
      const end = document.getElementById('end-time').value;
      const sitterSel = document.getElementById('sitter-select');
      const selectedOpt = sitterSel.options[sitterSel.selectedIndex];
      const rate = selectedOpt ? parseFloat(selectedOpt.getAttribute('data-rate') || 20) : 20;

      if (start && end) {
        let [sH, sM] = start.split(':').map(Number);
        let [eH, eM] = end.split(':').map(Number);
        
        let startMins = sH * 60 + sM;
        let endMins = eH * 60 + eM;
        if (endMins < startMins) endMins += 24 * 60;
        
        const diffHours = Math.max(0, (endMins - startMins) / 60);
        document.getElementById('hours').value = diffHours.toFixed(1);
        document.getElementById('pay').value = Math.round(diffHours * rate);
      }
    }

    async function loadShifts() {
      const container = document.getElementById('shift-list');
      try {
        const res = await fetch(`${API_URL}?select=*&order=created_at.desc`, { headers });
        const data = await res.json();
        shiftsCache = data || [];

        if (!shiftsCache || shiftsCache.length === 0) {
          container.innerHTML = '<p style="color:var(--muted)">No shifts logged yet.</p>';
          return;
        }

        container.innerHTML = shiftsCache.map(shift => {
          const name = shift.sitterName || shift.sittername || shift.sitter || 'Sitter';
          const profile = sittersCache.find(s => s.name.toLowerCase() === name.toLowerCase()) || {};
          const isChecked = selectedShifts.has(shift.id);

          return `
            <div class="shift-card">
              <div class="shift-top-row">
                <label class="select-label">
                  <input type="checkbox" class="shift-select" ${isChecked ? 'checked' : ''} onchange="toggleSelect('${shift.id}', this.checked)">
                  <span>Select</span>
                </label>
                <span onclick="togglePaid('${shift.id}', ${shift.paid})" style="cursor:pointer; padding:4px 8px; border-radius:6px; font-size:0.75rem; font-weight:600; ${shift.paid ? 'background:rgba(16,185,129,0.2); color:#34d399;' : 'background:rgba(239,68,68,0.2); color:#f87171;'}">
                  ${shift.paid ? '✓ Paid' : 'Unpaid'}
                </span>
              </div>

              <div class="shift-body">
                <div class="shift-header">
                  <div class="shift-name-area">
                    ${profile.avatar ? `<img src="${profile.avatar}" class="sitter-avatar">` : ''}
                    <span class="shift-name">${name}</span>
                  </div>
                  <span class="shift-pay">$${shift.pay}</span>
                </div>
                <div class="shift-meta">
                  <span>📅 ${shift.date}</span>
                  <span>⏱ ${shift.hours} hrs</span>
                </div>
                ${shift.notes ? `<div class="shift-notes">${shift.notes}</div>` : ''}
                
                ${!shift.paid && (profile.venmo || profile.paypal) ? `
                  <div class="pay-links" style="margin-top:10px;">
                    ${profile.venmo ? `<a href="https://venmo.com/${profile.venmo.replace('@','')}?txn=pay&amount=${shift.pay}&note=Babysitting" target="_blank" class="pay-link venmo-btn">Pay $${shift.pay} via Venmo</a>` : ''}
                    ${profile.paypal ? `<a href="https://${profile.paypal.replace('https://','')}/${shift.pay}" target="_blank" class="pay-link paypal-btn">Pay $${shift.pay} via PayPal</a>` : ''}
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:#ef4444">Connection Error: ${err.message}</p>`;
      }
    }

    document.getElementById('shift-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-shift-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging...';

      const sitterVal = document.getElementById('sitter-select').value;
      const hoursVal = parseFloat(document.getElementById('hours').value);
      const payVal = parseFloat(document.getElementById('pay').value);
      const dateVal = document.getElementById('date').value;
      const notesVal = document.getElementById('notes').value;

      // Clean payload strictly matching Supabase table columns
      const payload = {
        date: dateVal,
        sitterName: sitterVal,
        hours: hoursVal,
        pay: payVal,
        notes: notesVal,
        paid: false
      };

      try {
        const response = await fetch(API_URL, { method: 'POST', headers, body: JSON.stringify(payload) });
        if (!response.ok) {
          const errText = await response.text();
          alert('Error logging shift: ' + errText);
        } else {
          document.getElementById('shift-form').reset();
          document.getElementById('date').valueAsDate = new Date();
          await loadShifts();
        }
      } catch (err) {
        alert('Failed to connect: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log Shift';
      }
    });

    async function togglePaid(id, currentStatus) {
      await fetch(`${API_URL}?id=eq.${id}`, {
        method: 'PATCH', headers, body: JSON.stringify({ paid: !currentStatus })
      });
      loadShifts();
    }

    function toggleSelect(id, isChecked) {
      const shift = shiftsCache.find(s => s.id === id);
      if (isChecked && shift) {
        selectedShifts.set(id, shift);
      } else {
        selectedShifts.delete(id);
      }
      updateBatchToolbar();
    }

    function updateBatchToolbar() {
      const bar = document.getElementById('batch-bar');
      const payLinksContainer = document.getElementById('batch-pay-links');
      
      if (selectedShifts.size === 0) {
        bar.classList.remove('visible');
        return;
      }

      let totalPay = 0;
      let selectedProfiles = new Set();

      selectedShifts.forEach(shift => {
        totalPay += (shift.pay || 0);
        const name = shift.sitterName || shift.sittername || shift.sitter || '';
        const profile = sittersCache.find(s => s.name.toLowerCase() === name.toLowerCase());
        if (profile) selectedProfiles.add(profile);
      });

      document.getElementById('batch-count').textContent = selectedShifts.size;
      document.getElementById('batch-total').textContent = `$${totalPay}`;

      let linksHtml = '';
      if (selectedProfiles.size === 1) {
        const sitter = Array.from(selectedProfiles)[0];
        if (sitter.venmo) {
          const venmoUrl = `https://venmo.com/${sitter.venmo.replace('@','')}?txn=pay&amount=${totalPay}&note=Babysitting%20(${selectedShifts.size}%20shifts)`;
          linksHtml += `<a href="${venmoUrl}" target="_blank" class="pay-link venmo-btn" style="flex:1;">Pay $${totalPay} via Venmo</a>`;
        }
        if (sitter.paypal) {
          const paypalUrl = `https://${sitter.paypal.replace('https://','')}/${totalPay}`;
          linksHtml += `<a href="${paypalUrl}" target="_blank" class="pay-link paypal-btn" style="flex:1;">Pay $${totalPay} via PayPal</a>`;
        }
      } else if (selectedProfiles.size > 1) {
        linksHtml = `<span style="font-size:0.75rem; color:var(--muted)">Select shifts for a single sitter to use consolidated Venmo/PayPal</span>`;
      }

      payLinksContainer.innerHTML = linksHtml;
      bar.classList.add('visible');
    }

    async function batchMarkPaid() {
      for (let id of selectedShifts.keys()) {
        await fetch(`${API_URL}?id=eq.${id}`, {
          method: 'PATCH', headers, body: JSON.stringify({ paid: true })
        });
      }
      selectedShifts.clear();
      updateBatchToolbar();
      loadShifts();
    }
  </script>
</body>
</html>
