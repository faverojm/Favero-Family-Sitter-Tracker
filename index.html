<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Favero Family Sitter Tracker</title>

<style>

button,input,select,textarea{font:inherit}

<body>

<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* =========================================================
   FAVERO FAMILY SITTER TRACKER
   Phase 1 - Local Device Version

   Features:
   - PIN landing page
   - Family logo/photo
   - Dashboard banner
   - Sitter profiles + avatars
   - Sitter archive/restore
   - Shift logging
   - Historical hourly rates
   - Adjustments/bonuses/reimbursements/deductions
   - Flexible payments
   - Pay multiple shifts in one transaction
   - Payment history
   - Backup / restore
   - Mobile-first design
   ========================================================= */

const KEYS = {
  sitters: "favero_sitters_v2",
  shifts: "favero_shifts_v2",
  payments: "favero_payments_v2",
  settings: "favero_settings_v2",
  unlocked: "favero_unlocked_v2"
};

const DEFAULT_SETTINGS = {
  pin: "1313",
  familyName: "Favero Family",
  banner: "",
  logo: ""
};

let state = {
  sitters: [],
  shifts: [],
  payments: [],
  settings: {...DEFAULT_SETTINGS},
  tab: "dashboard",
  filter: "outstanding",
  sitterFilter: "all",
  dateFrom: "",
  dateTo: ""
};


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,8);
}

function round2(n){
  return Math.round((Number(n)||0)*100)/100;
}

function money(n){
  return new Intl.NumberFormat("en-US",{
    style:"currency",
    currency:"USD"
  }).format(Number(n)||0);
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function initials(name){
  const parts = String(name||"")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  return parts
    .slice(0,2)
    .map(x => x[0].toUpperCase())
    .join("") || "?";
}

function todayISO(){
  const d = new Date();
  const offset = d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000)
    .toISOString()
    .slice(0,10);
}

function fmtDate(value){
  if(!value) return "";

  const d = new Date(value+"T12:00:00");

  if(isNaN(d)) return value;

  return d.toLocaleDateString(undefined,{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function load(key,fallback){
  try{
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  }catch{
    return fallback;
  }
}

function save(){
  localStorage.setItem(KEYS.sitters,JSON.stringify(state.sitters));
  localStorage.setItem(KEYS.shifts,JSON.stringify(state.shifts));
  localStorage.setItem(KEYS.payments,JSON.stringify(state.payments));
  localStorage.setItem(KEYS.settings,JSON.stringify(state.settings));
}

function getSitter(id){
  return state.sitters.find(s => s.id === id);
}

function calcHours(start,end){
  if(!start || !end) return 0;

  const [sh,sm] = start.split(":").map(Number);
  const [eh,em] = end.split(":").map(Number);

  let startMinutes = sh*60+sm;
  let endMinutes = eh*60+em;

  if(endMinutes <= startMinutes){
    endMinutes += 1440;
  }

  return round2((endMinutes-startMinutes)/60);
}

function shiftPaid(shift){
  return !!shift.paymentId;
}

function shiftTotal(shift){
  return Number(
    shift.totalPay ??
    (
      (Number(shift.hours)||0) *
      (Number(shift.hourlyRate)||0) +
      (Number(shift.adjustment)||0)
    )
  );
}

function sitterShifts(id){
  return state.shifts.filter(s => s.sitterId === id);
}

function sitterOutstanding(id){
  return sitterShifts(id).filter(s => !shiftPaid(s));
}

function sitterOwed(id){
  return round2(
    sitterOutstanding(id)
      .reduce((total,s) => total + shiftTotal(s),0)
  );
}

function totalOutstanding(){
  return round2(
    state.shifts
      .filter(s => !shiftPaid(s))
      .reduce((total,s) => total + shiftTotal(s),0)
  );
}

function totalPaid(){
  return round2(
    state.payments
      .reduce((total,p) => total + Number(p.amount||0),0)
  );
}

function activeSitters(){
  return state.sitters.filter(s => !s.archived);
}

function recent(items){
  return [...items].sort((a,b) =>
    String(b.date).localeCompare(String(a.date))
  );
}


/* =========================================================
   MIGRATION FROM ORIGINAL VERSION
   ========================================================= */

function migrateOldData(){

  const oldSitters = load("favero_sitters",null);
  const oldShifts = load("favero_shifts",null);

  if(
    state.sitters.length ||
    state.shifts.length ||
    !oldSitters
  ){
    return;
  }

  const sitterMap = {};

  state.sitters = (
    Array.isArray(oldSitters)
      ? oldSitters
      : []
  ).map(old => {

    const id = uid("sit");

    sitterMap[old.id ?? old.name] = id;

    return {
      id,
      name: old.name || "Unnamed Sitter",
      rate: Number(old.rate)||0,
      paymentInfo: old.paymentInfo || "",
      archived: false,
      avatar: ""
    };
  });

  state.shifts = (
    Array.isArray(oldShifts)
      ? oldShifts
      : []
  ).map(old => {

    const sitter = state.sitters.find(
      s =>
        s.name === old.sitter ||
        s.id === old.sitterId
    );

    const start = old.start || "";
    const end = old.end || "";

    const hours = calcHours(start,end);

    const hourlyRate =
      Number(old.hourlyRate ??
      sitter?.rate ??
      0);

    const basePay =
      round2(hours * hourlyRate);

    const adjustment =
      Number(old.adjustment)||0;

    return {
      id: uid("sh"),
      sitterId: sitter?.id || "",
      sitterName: sitter?.name || old.sitter || "",
      date: old.date || todayISO(),
      start,
      end,
      hours,
      hourlyRate,
      basePay,
      adjustment,
      adjustmentType: old.adjustmentType || "none",
      adjustmentNote: old.adjustmentNote || "",
      totalPay: round2(basePay + adjustment),
      notes: old.notes || "",
      paymentId: null
    };
  });

  save();
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function init(){

  state.sitters =
    load(KEYS.sitters,[]);

  state.shifts =
    load(KEYS.shifts,[]);

  state.payments =
    load(KEYS.payments,[]);

  state.settings = {
    ...DEFAULT_SETTINGS,
    ...load(KEYS.settings,{})
  };

  migrateOldData();

  state.sitters = state.sitters.map(s => ({
    ...s,
    avatar: s.avatar || "",
    archived: !!s.archived
  }));

  state.shifts = state.shifts.map(s => ({
    ...s,
    adjustment: Number(s.adjustment)||0,
    totalPay: Number(
      s.totalPay ??
      (
        (Number(s.hours)||0) *
        (Number(s.hourlyRate)||0) +
        (Number(s.adjustment)||0)
      )
    ),
    paymentId: s.paymentId || null
  }));

  state.payments = state.payments.map(p => ({
    ...p,
    shiftIds: Array.isArray(p.shiftIds)
      ? p.shiftIds
      : [],
    amount: Number(p.amount)||0
  }));

  save();

  render();
}


/* =========================================================
   AVATARS / BRANDING
   ========================================================= */

function avatarHTML(s,size=""){

  const cls = "avatar " + size;

  if(s?.avatar){

    return `
      <div class="${cls}">
        <img
          src="${esc(s.avatar)}"
          alt=""
        >
      </div>
    `;
  }

  return `
    <div class="${cls}">
      ${esc(initials(s?.name))}
    </div>
  `;
}

function logoHTML(){

  if(state.settings.logo){

    return `
      <div class="brand-avatar">
        <img
          src="${esc(state.settings.logo)}"
          alt=""
        >
      </div>
    `;
  }

  return `
    <div class="brand-avatar">F</div>
  `;
}

async function imageToDataUrl(
  file,
  maxDimension=1000,
  quality=.8
){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => {

        let width = img.naturalWidth;
        let height = img.naturalHeight;

        const scale =
          Math.min(
            1,
            maxDimension /
            Math.max(width,height)
          );

        width = Math.round(width * scale);
        height = Math.round(height * scale);

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );
      };

      img.onerror = reject;
      img.src = reader.result;
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

  const root =
    document.getElementById("app");

  if(
    sessionStorage.getItem(KEYS.unlocked)
    !== "yes"
  ){

    root.innerHTML = renderPin();

    bindPin();

    return;
  }

  root.innerHTML = renderMain();

  bindMain();
}

function renderPin(){

  return `
    <div class="pin-screen">

      <div class="pin-card card">

        <div class="pin-logo">

          ${
            state.settings.logo

              ? `
                <img
                  src="${esc(state.settings.logo)}"
                  alt=""
                >
              `

              : `<span>F</span>`
          }

        </div>

        <h1>
          ${esc(state.settings.familyName)}
        </h1>

        <p class="muted">
          Sitter Tracker
        </p>

        <div
          class="pin-dots"
          id="pinDots"
        >
          ${[0,1,2,3].map(i => `
            <span
              class="pin-dot"
              data-dot="${i}"
            ></span>
          `).join("")}
        </div>

        <div
          id="pinError"
          class="pin-error"
        ></div>

        <div class="keypad">

          ${[1,2,3,4,5,6,7,8,9]
            .map(n => `
              <button
                data-key="${n}"
              >
                ${n}
              </button>
            `).join("")}

          <button data-key="back">
            ⌫
          </button>

          <button
            class="zero"
            data-key="0"
          >
            0
          </button>

          <button data-key="enter">
            ✓
          </button>

        </div>

        <div class="footer-note">
          PIN is a convenience lock, not encryption.
        </div>

      </div>

    </div>
  `;

/* =========================================================
   PIN
   ========================================================= */

function bindPin(){

  let entered = "";

  function update(){

    document
      .querySelectorAll("[data-dot]")
      .forEach((dot,index)=>{
        dot.classList.toggle(
          "filled",
          index < entered.length
        );
      });
  }

  function submit(){

    if(
      entered ===
      String(state.settings.pin || "1313")
    ){

      sessionStorage.setItem(
        KEYS.unlocked,
        "yes"
      );

      render();

    }else{

      document
        .getElementById("pinError")
        .textContent =
        "Incorrect PIN";

      entered = "";

      update();
    }
  }

  document
    .querySelectorAll("[data-key]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const key =
            button.dataset.key;

          if(key === "back"){

            entered =
              entered.slice(0,-1);

          }else if(key === "enter"){

            if(entered.length === 4){
              submit();
            }

            return;

          }else if(entered.length < 4){

            entered += key;
          }

          update();

          if(entered.length === 4){

            setTimeout(
              submit,
              120
            );
          }
        }
      );
    });
}

   ========================================================= */

function renderShifts(){

  let items = recent(state.shifts);

  const filter = state.filter;

  const now = new Date();

  const startWeek =
    new Date(now);

  startWeek.setHours(0,0,0,0);

  const day =
    startWeek.getDay();

  startWeek.setDate(
    startWeek.getDate() -
    (day === 0 ? 6 : day-1)
  );

  const weekISO =
    new Date(
      startWeek.getTime() -
      startWeek.getTimezoneOffset()*60000
    )
    .toISOString()
    .slice(0,10);

  const monthISO =
    todayISO().slice(0,7);

  if(state.sitterFilter !== "all"){

    items =
      items.filter(
        s =>
          s.sitterId ===
          state.sitterFilter
      );
  }

  if(filter === "outstanding")
    items = items.filter(
      s => !shiftPaid(s)
    );

  if(filter === "paid")
    items = items.filter(
      s => shiftPaid(s)
    );

  if(filter === "week")
    items = items.filter(
      s => s.date >= weekISO
    );

  if(filter === "month")
    items = items.filter(
      s => s.date.startsWith(monthISO)
    );

  if(filter === "custom"){

    if(state.dateFrom)
      items =
        items.filter(
          s => s.date >= state.dateFrom
        );

    if(state.dateTo)
      items =
        items.filter(
          s => s.date <= state.dateTo
        );
  }

  return `

    <div class="section-title">

      <h1>
        Shifts
      </h1>

      <button
        class="primary small"
        id="addShiftBtn"
      >
        + Add Shift
      </button>

    </div>


    <div class="card item">

      <div class="grid2">

        <div class="field">

          <label>
            View
          </label>

          <select id="shiftFilter">

            <option
              value="outstanding"
              ${filter==="outstanding"?"selected":""}
            >
              Outstanding
            </option>

            <option
              value="all"
              ${filter==="all"?"selected":""}
            >
              All Shifts
            </option>

            <option
              value="paid"
              ${filter==="paid"?"selected":""}
            >
              Paid
            </option>

            <option
              value="week"
              ${filter==="week"?"selected":""}
            >
              This Week
            </option>

            <option
              value="month"
              ${filter==="month"?"selected":""}
            >
              This Month
            </option>

            <option
              value="custom"
              ${filter==="custom"?"selected":""}
            >
              Custom Dates
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Sitter
          </label>

          <select id="sitterFilter">

            <option value="all">
              All Sitters
            </option>

            ${
              state.sitters.map(s => `

                <option
                  value="${esc(s.id)}"
                  ${
                    state.sitterFilter===s.id
                      ? "selected"
                      : ""
                  }
                >
                  ${esc(s.name)}
                  ${s.archived?" (Archived)":""}
                </option>

              `).join("")
            }

          </select>

        </div>

      </div>


      ${
        filter === "custom"

          ? `

            <div class="grid2">

              <div class="field">

                <label>
                  From
                </label>

                <input
                  id="dateFrom"
                  type="date"
                  value="${esc(state.dateFrom)}"
                >

              </div>

              <div class="field">

                <label>

                <input

              file,
              1400,
              .78
            );

          save();

          render();

          toast("Banner updated");

        }catch{

          toast("Could not load image");
        }
      }
    );


  document
    .getElementById("clearLogo")
    ?.addEventListener(
      "click",
      () => {

        state.settings.logo = "";

        save();

        render();
      }
    );


  document
    .getElementById("clearBanner")
    ?.addEventListener(
      "click",
      () => {

        state.settings.banner = "";

        save();

        render();
      }
    );


  document
    .getElementById("exportBtn")
    ?.addEventListener(
      "click",
      exportBackup
    );


  document
    .getElementById("importBtn")
    ?.addEventListener(
      "click",
      () =>
        document
          .getElementById("importFile")
          .click()
    );


  document
    .getElementById("importFile")
    ?.addEventListener(
      "change",
      importBackup
    );


  document
    .getElementById("clearAllBtn")
    ?.addEventListener(
      "click",
      clearAll
    );
}
