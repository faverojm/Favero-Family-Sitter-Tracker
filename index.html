<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>Family Sitter Tracker</title>
<style>
:root{--bg:#0b0f14;--card:#131a22;--card2:#18212b;--text:#f4f7fa;--muted:#9aa8b5;--line:#263341;--accent:#6ee7b7;--danger:#fb7185;--warn:#fbbf24;--shadow:0 12px 30px #0008}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#062218;font-weight:750;cursor:pointer}button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}button.danger{background:var(--danger);color:#300811}button.small{padding:7px 10px;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}.top{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}.banner{height:155px;background:#111923 center/cover no-repeat}.banner.noimg{height:90px}.brand{display:flex;gap:12px;align-items:center;padding:14px}.logo{width:58px;height:58px;border-radius:16px;object-fit:cover;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted)}nav{display:flex;gap:7px;overflow:auto;padding:0 2px 12px;position:sticky;top:0;z-index:5;background:var(--bg)}nav button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line)}nav button.active{background:var(--accent);color:#062218;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.stat{font-size:25px;font-weight:800}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:grid;gap:8px}.item{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px}.person{display:flex;gap:10px;align-items:center;min-width:0}.person>div:last-child{min-width:0}.person strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#263341;display:grid;place-items:center;font-weight:800;flex:none}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted)}.pill.good{color:var(--accent);border-color:#2c6955}.pill.warn{color:var(--warn)}.section-title{font-size:18px;margin:18px 0 9px}.empty{text-align:center;padding:25px;color:var(--muted)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters select,.filters input{width:auto}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;background:#0e141b;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}textarea{min-height:80px;resize:vertical}.modalbg{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:end center;padding:10px}.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.modal h2{margin:0 0 12px}.close{background:transparent;color:var(--muted);font-size:22px;padding:3px}.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.check input{width:auto;margin-top:3px}.paytotal{font-size:24px;font-weight:800;margin:10px 0}.pin{min-height:100vh;display:grid;place-items:center;padding:20px}.pinbox{width:min(390px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.pinlogo{width:90px;height:90px;border-radius:22px;object-fit:cover;background:var(--card2);margin:0 auto 14px;display:grid;place-items:center;font-size:28px;font-weight:800}.dots{font-size:28px;letter-spacing:8px;height:40px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{background:var(--card2);color:var(--text);border:1px solid var(--line);font-size:19px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#f4f7fa;color:#0b0f14;padding:11px 15px;border-radius:999px;z-index:50;box-shadow:var(--shadow);font-weight:700}.file{padding:8px}.notice{padding:10px;border-radius:10px;background:#10231d;border:1px solid #245943;color:#b9f7dc;font-size:13px}.dangerbox{padding:10px;border-radius:10px;background:#2b1117;border:1px solid #6a2735;color:#fecdd3;font-size:13px}.adjust{display:flex;gap:7px;align-items:center;margin:7px 0}.adjust>*{flex:1}.adjust button{flex:0 0 auto}.breakdown{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.line.total{font-weight:800;padding-top:7px;margin-top:4px;border-top:1px solid var(--line)}.method{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:11px;margin:7px 0}.method small{color:var(--muted)}.muted{color:var(--muted)}.hidden{display:none!important}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.banner{height:220px}.modalbg{place-items:center}}
</style>
</head>
<body><div id="app"></div><div id="toast"></div>
<script>
'use strict';

const K={
  sitters:'fst_sitters',
  shifts:'fst_shifts',
  payments:'fst_payments',
  settings:'fst_settings'
};

const DEF={
  pin:'1313',
  familyName:'Favero Family',
  logo:'',
  banner:''
};

let state={
  sitters:[],
  shifts:[],
  payments:[],
  settings:{...DEF},
  tab:'dashboard',
  filter:'outstanding',
  sitterFilter:'all',
  from:'',
  to:''
};

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=n=>'$'+Number(n||0).toFixed(2);
const round=n=>Math.round((Number(n)||0)*100)/100;

const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  "'":'&#39;',
  '"':'&quot;'
}[c]));

const initials=s=>String(s||'?')
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join('')
  .toUpperCase()||'?';

const today=()=>new Date().toISOString().slice(0,10);

const fmt=d=>d
  ?new Date(d+'T12:00:00').toLocaleDateString(undefined,{
    month:'short',
    day:'numeric',
    year:'numeric'
  })
  :'';

const sitter=id=>state.sitters.find(s=>s.id===id);

function notify(msg){
  let t=$('toast');
  t.textContent=msg;
  t.className='toast';
  clearTimeout(notify.t);
  notify.t=setTimeout(()=>t.className='',2600);
}

function normalize(){
  state.sitters=Array.isArray(state.sitters)?state.sitters:[];
  state.shifts=Array.isArray(state.shifts)?state.shifts:[];
  state.payments=Array.isArray(state.payments)?state.payments:[];

  state.sitters=state.sitters.map(s=>({
    ...s,
    id:s.id||uid(),
    paymentMethods:Array.isArray(s.paymentMethods)?s.paymentMethods:[],
    avatar:s.avatar||'',
    archived:!!s.archived
  }));

  state.shifts=state.shifts.map(s=>{
    let adjustments=Array.isArray(s.adjustments)?s.adjustments:[];

    if(!adjustments.length&&(Number(s.adjustment)||0)!==0){
      adjustments=[{
        id:uid(),
        type:s.adjustmentType||'other',
        amount:Number(s.adjustment)||0,
        note:s.adjustmentNote||''
      }];
    }

    let base=round(
      Number(s.basePay)||
      round((Number(s.hours)||0)*(Number(s.hourlyRate)||0))
    );

    return {
      ...s,
      id:s.id||uid(),
      adjustments,
      totalPay:round(
        base+
        adjustments.reduce((a,x)=>a+Number(x.amount||0),0)
      ),
      basePay:base
    };
  });
}

function save(){
  try{
    localStorage.setItem(K.sitters,JSON.stringify(state.sitters));
    localStorage.setItem(K.shifts,JSON.stringify(state.shifts));
    localStorage.setItem(K.payments,JSON.stringify(state.payments));
    localStorage.setItem(K.settings,JSON.stringify(state.settings));
    return true;
  }catch(e){
    notify('Browser storage is full. Try smaller photos.');
    return false;
  }
}

function load(){
  try{
    state.sitters=JSON.parse(localStorage.getItem(K.sitters)||'[]');
    state.shifts=JSON.parse(localStorage.getItem(K.shifts)||'[]');
    state.payments=JSON.parse(localStorage.getItem(K.payments)||'[]');
    state.settings={
      ...DEF,
      ...JSON.parse(localStorage.getItem(K.settings)||'{}')
    };
  }catch(e){
    state.sitters=[];
    state.shifts=[];
    state.payments=[];
    state.settings={...DEF};
  }

  normalize();
  save();
}

function hours(a,b){
  if(!a||!b)return 0;

  let [h,m]=a.split(':').map(Number);
  let [eh,em]=b.split(':').map(Number);

  let x=h*60+m;
  let y=eh*60+em;

  if(y<=x)y+=1440;

  return round((y-x)/60);
}

function adjustmentsTotal(s){
  return round(
    (s.adjustments||[])
      .reduce((a,x)=>a+Number(x.amount||0),0)
  );
}

function total(s){
  return round(
    Number(s.basePay||0)+
    adjustmentsTotal(s)
  );
}

function paid(s){
  return !!s.paymentId;
}

function outstandingFor(id){
  return round(
    state.shifts
      .filter(s=>s.sitterId===id&&!paid(s))
      .reduce((a,s)=>a+total(s),0)
  );
}

function unpaid(id){
  return state.shifts
    .filter(s=>s.sitterId===id&&!paid(s))
    .sort((a,b)=>b.date.localeCompare(a.date));
}

function image(file,max=1000,quality=.78){
  return new Promise((res,rej)=>{
    if(!file)return res('');

    let r=new FileReader();

    r.onerror=rej;

    r.onload=()=>{
      let im=new Image();

      im.onload=()=>{
        let scale=Math.min(
          1,
          max/Math.max(im.width,im.height)
        );

        let c=document.createElement('canvas');

        c.width=Math.max(1,Math.round(im.width*scale));
        c.height=Math.max(1,Math.round(im.height*scale));

        c.getContext('2d').drawImage(
          im,
          0,
          0,
          c.width,
          c.height
        );

        res(c.toDataURL('image/jpeg',quality));
      };

      im.onerror=rej;
      im.src=r.result;
    };

    r.readAsDataURL(file);
  });
}

function imgOrInitial(src,name,cls='avatar'){
  return src
    ?`<img class="${cls}" src="${esc(src)}" alt="">`
    :`<div class="${cls}">${esc(initials(name))}</div>`;
}

function shell(){
  let s=state.settings;

  return `
  <div class="wrap">
    <header class="top">
      ${
        s.banner
        ?`<div class="banner" style="background-image:url('${esc(s.banner)}')"></div>`
        :'<div class="banner noimg"></div>'
      }

      <div class="brand">
        ${imgOrInitial(s.logo,s.familyName,'logo')}

        <div>
          <h1>${esc(s.familyName)}</h1>
          <p>Family sitter tracker</p>
        </div>

        <button
          class="secondary small"
          style="margin-left:auto"
          onclick="lock()"
        >
          Lock
        </button>
      </div>
    </header>

    <nav>
      ${
        [
          ['dashboard','Dashboard'],
          ['shifts','Shifts'],
          ['sitters','Sitters'],
          ['payments','Payments'],
          ['settings','Settings']
        ]
        .map(x=>`
          <button
            class="${state.tab===x[0]?'active':''}"
            onclick="tab('${x[0]}')"
          >
            ${x[1]}
          </button>
        `)
        .join('')
      }
    </nav>

    <main id="main"></main>
  </div>`;
}

function tab(t){
  state.tab=t;
  render();
}

function render(){
  document.body.innerHTML='<div id="app"></div><div id="toast"></div>';

  if(!sessionStorage.getItem('fst_unlocked')){
    return pin();
  }

  $('app').innerHTML=shell();

  if(state.tab==='dashboard')dashboard();
  if(state.tab==='shifts')shiftsPage();
  if(state.tab==='sitters')sittersPage();
  if(state.tab==='payments')paymentsPage();
  if(state.tab==='settings')settingsPage();
}

let pinbuf='';

function pin(){
  document.getElementById('app').innerHTML=`
    <div class="pin">
      <div class="pinbox">
        ${imgOrInitial(state.settings.logo,state.settings.familyName,'pinlogo')}

        <h1>${esc(state.settings.familyName)}</h1>

        <p class="muted">Enter your PIN</p>

        <div id="dots" class="dots">
          ○ ○ ○ ○
        </div>

        <div class="keypad">
          ${
            [1,2,3,4,5,6,7,8,9,'C',0,'⌫']
            .map(k=>`
              <button onclick="pinKey('${k}')">
                ${k}
              </button>
            `)
            .join('')
          }
        </div>
      </div>
    </div>`;
}

function pinKey(k){
  if(k==='C'){
    pinbuf='';
  }else if(k==='⌫'){
    pinbuf=pinbuf.slice(0,-1);
  }else if(pinbuf.length<4){
    pinbuf+=k;
  }

  if(pinbuf.length===4){
    if(pinbuf===state.settings.pin){
      sessionStorage.setItem('fst_unlocked','1');
      pinbuf='';
      render();
      return;
    }else{
      notify('Incorrect PIN');
      pinbuf='';
    }
  }

  if($('dots')){
    $('dots').textContent=
      pinbuf.padEnd(4,'○').split('').join(' ');
  }
}

function lock(){
  sessionStorage.removeItem('fst_unlocked');
  pinbuf='';
  render();
}

function dashboard(){
  let owed=round(
    state.shifts
      .filter(s=>!paid(s))
      .reduce((a,s)=>a+total(s),0)
  );

  let paidTotal=round(
    state.shifts
      .filter(paid)
      .reduce((a,s)=>a+total(s),0)
  );

  let people=state.sitters
    .map(s=>({...s,owed:outstandingFor(s.id)}))
    .filter(s=>s.owed>0)
    .sort((a,b)=>b.owed-a.owed);

  let recent=[...state.shifts]
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,6);

  $('main').innerHTML=`
    <div class="grid">

      <div class="card">
        <div class="label">Currently owed</div>
        <div class="stat money">${money(owed)}</div>
      </div>

      <div class="card">
        <div class="label">Paid on recorded shifts</div>
        <div class="stat money">${money(paidTotal)}</div>
      </div>

      <div class="card">
        <div class="label">Sitting shifts</div>
        <div class="stat">${state.shifts.length}</div>
      </div>

      <div class="card">
        <div class="label">Sitters</div>
        <div class="stat">${state.sitters.length}</div>
      </div>

    </div>

    <div class="row section-title">
      <span>Currently Owed</span>
      <button class="small" onclick="openPay()">Pay Sitter</button>
    </div>

    <div class="list">
      ${
        people.length
        ?people.map(s=>`
          <div class="item">
            <div class="row">

              <div class="person">
                ${imgOrInitial(s.avatar,s.name)}

                <div>
                  <strong>
                    ${esc(s.name)}
                    ${s.archived?'<span class="pill">Archived</span>':''}
                  </strong>

                  <span class="muted">
                    ${unpaid(s.id).length}
                    unpaid shift${unpaid(s.id).length===1?'':'s'}
                  </span>
                </div>
              </div>

              <div>
                <strong class="money">${money(s.owed)}</strong>
                <br>
                <button
                  class="small"
                  onclick="openPay('${s.id}')"
                >
                  Pay
                </button>
              </div>

            </div>
          </div>
        `).join('')
        :'<div class="card empty">Nothing is currently owed.</div>'
      }
    </div>

    <h2 class="section-title">Recent Shifts</h2>

    <div class="list">
      ${
        recent.length
        ?recent.map(shiftItem).join('')
        :'<div class="card empty">No shifts yet.</div>'
      }
    </div>`;
}

function breakdownHTML(s){
  let rows=[
    `<div class="line">
      <span>
        Hours (${s.hours}h × ${money(s.hourlyRate)})
      </span>
      <span>${money(s.basePay)}</span>
    </div>`
  ];

  (s.adjustments||[]).forEach(a=>{
    rows.push(`
      <div class="line">
        <span>
          ${esc(a.typeLabel||a.type||'Adjustment')}
          ${a.note?' — '+esc(a.note):''}
        </span>
        <span>${money(a.amount)}</span>
      </div>
    `);
  });

  rows.push(`
    <div class="line total">
      <span>Total</span>
      <span>${money(total(s))}</span>
    </div>
  `);

  return `<div class="breakdown">${rows.join('')}</div>`;
}

function shiftItem(s){
  let p=sitter(s.sitterId);
  let pay=state.payments.find(x=>x.id===s.paymentId);

  return `
    <div class="item">
      <div class="row">

        <div>
          <strong>
            ${esc(s.sitterName||p?.name||'Unknown')}
          </strong>

          <div class="muted">
            ${fmt(s.date)} · ${esc(s.start)}–${esc(s.end)}
          </div>
        </div>

        <div style="text-align:right">
          <strong class="money">${money(total(s))}</strong>
          <br>

          <span class="pill ${paid(s)?'good':'warn'}">
            ${paid(s)?`Paid ${fmt(pay?.date)}`:'Unpaid'}
          </span>
        </div>

      </div>

      ${breakdownHTML(s)}
    </div>`;
}

function shiftsPage(){
  let list=[...state.shifts];

  if(state.sitterFilter!=='all'){
    list=list.filter(s=>s.sitterId===state.sitterFilter);
  }

  if(state.filter==='outstanding'){
    list=list.filter(s=>!paid(s));
  }

  if(state.filter==='paid'){
    list=list.filter(paid);
  }

  if(state.filter==='week'){
    let d=new Date();
    let day=(d.getDay()+6)%7;
    let from=new Date(d);

    from.setDate(d.getDate()-day);

    list=list.filter(
      s=>s.date>=from.toISOString().slice(0,10)
    );
  }

  if(state.filter==='month'){
    let m=today().slice(0,7);
    list=list.filter(s=>s.date.startsWith(m));
  }

  if(state.filter==='custom'){
    if(state.from){
      list=list.filter(s=>s.date>=state.from);
    }

    if(state.to){
      list=list.filter(s=>s.date<=state.to);
    }
  }

  list.sort((a,b)=>b.date.localeCompare(a.date));

  $('main').innerHTML=`
    <div class="row">
      <h2>Shifts</h2>
      <button onclick="openShift()">+ Shift</button>
    </div>

    <div class="filters">

      <select onchange="state.filter=this.value;render()">
        ${
          [
            ['outstanding','Outstanding'],
            ['all','All'],
            ['paid','Paid'],
            ['week','This Week'],
            ['month','This Month'],
            ['custom','Custom Dates']
          ]
          .map(x=>`
            <option
              value="${x[0]}"
              ${state.filter===x[0]?'selected':''}
            >
              ${x[1]}
            </option>
          `)
          .join('')
        }
      </select>

      <select onchange="state.sitterFilter=this.value;render()">
        <option value="all">All Sitters</option>

        ${
          state.sitters.map(s=>`
            <option
              value="${s.id}"
              ${state.sitterFilter===s.id?'selected':''}
            >
              ${esc(s.name)}
            </option>
          `).join('')
        }
      </select>

    </div>

    ${
      state.filter==='custom'
      ?`
        <div class="grid">
          <input
            type="date"
            value="${state.from}"
            onchange="state.from=this.value;render()"
          >

          <input
            type="date"
            value="${state.to}"
            onchange="state.to=this.value;render()"
          >
        </div>
      `
      :''
    }

    <div class="list" style="margin-top:10px">
      ${
        list.length
        ?list.map(s=>`
          <div class="item">
            ${shiftItem(s)}

            ${
              !paid(s)
              ?`
                <div class="actions" style="margin-top:8px">
                  <button
                    class="secondary small"
                    onclick="openShift('${s.id}')"
                  >
                    Edit
                  </button>

                  <button
                    class="danger small"
                    onclick="deleteShift('${s.id}')"
                  >
                    Delete
                  </button>
                </div>
              `
              :''
            }
          </div>
        `).join('')
        :'<div class="card empty">No shifts match this filter.</div>'
      }
    </div>`;
}

function sittersPage(){
  let active=state.sitters.filter(s=>!s.archived);
  let arch=state.sitters.filter(s=>s.archived);

  $('main').innerHTML=`
    <div class="row">
      <h2>Sitters</h2>
      <button onclick="openSitter()">+ Sitter</button>
    </div>

    <div class="list">
      ${
        active.map(sitterCard).join('')||
        '<div class="card empty">No active sitters.</div>'
      }
    </div>

    ${
      arch.length
      ?`
        <h2 class="section-title">Archived</h2>
        <div class="list">
          ${arch.map(sitterCard).join('')}
        </div>
      `
      :''
    }`;
}

function sitterCard(s){
  return `
    <div class="card">
      <div class="row">

        <div class="person">
          ${imgOrInitial(s.avatar,s.name)}

          <div>
            <strong>${esc(s.name)}</strong>

            <div class="muted">
              ${money(s.rate)}/hr

    return notify('Enter the payment handle or account');

  window.editMethods.push({
    id:uid(),
    label,
    handle
  });

    paymentMethodsHTML(window.editMethods);

}

function removePaymentMethod(i){
  window.editMethods.splice(i,1);

}

function saveSitter(id){
  let name=$('sn').value.trim();
  let rate=Number($('sr').value);

  if(
    !name||
    !Number.isFinite(rate)||
    rate<0
  ){
    return notify('Enter a valid name and rate');
  }

  if(id){
    let s=sitter(id);

    Object.assign(s,{
      name,
      rate:round(rate),
      paymentMethods:window.editMethods,
      avatar:window.removeAvatar?'':window.newAvatar
    });
  }else{
    state.sitters.push({
      id:uid(),
      name,
      rate:round(rate),
      paymentMethods:window.editMethods,
      avatar:window.removeAvatar?'':window.newAvatar,
      archived:false
    });
  }

  save();
  closeModal();
  render();
  notify('Sitter saved');
}

function archiveSitter(id){

  if(!s)return;

  if(
    !s.archived&&
    !confirm(`Archive ${s.name}? Their history will remain.`)
  ){
    return;
  }

  s.archived=!s.archived;

  save();
  render();
}

function adjSigned(a){
  let n=Math.abs(Number(a.amount)||0);
  return a.type==='deduction'?-n:n;
}

function updatePreview(){
  let h=hours(
    $('sst').value,
    $('se').value
  );

  let base=round(
    h*(Number($('srate').value)||0)
  );

  let adj=round(
    (window.shiftAdjustments||[])
      .reduce((a,x)=>a+adjSigned(x),0)
  );

  $('preview').textContent=
    money(base+adj)+` (${h}h)`;
}

function saveShift(id){
  let s=sitter($('ss').value);

  if(!s)return notify('Choose a sitter');

  let h=hours(
    $('sst').value,
    $('se').value
  );

  if(!h){
    return notify(
      'Enter valid start and end times'
    );
  }

  let rate=Number($('srate').value);

  if(
    !Number.isFinite(rate)||
    rate<0
  ){
    return notify('Enter a valid rate');
  }

  let adj=(window.shiftAdjustments||[])
    .map(a=>({
      ...a,
      amount:round(adjSigned(a)),
      typeLabel:
        a.type.charAt(0).toUpperCase()+
        a.type.slice(1)
    }))
    .filter(
      a=>a.amount!==0||a.note
    );

  let base=round(h*rate);

  let obj={
    id:id||uid(),
    sitterId:s.id,
    sitterName:s.name,
    date:$('sd').value,
    start:$('sst').value,
    end:$('se').value,
    hours:h,
    hourlyRate:round(rate),
    basePay:base,
    adjustments:adj,
    totalPay:round(
      base+
      adj.reduce((a,x)=>a+x.amount,0)
    ),
    notes:$('snotes').value.trim(),
    paymentId:id
      ?(
        state.shifts.find(x=>x.id===id)?.paymentId||
        null
      )
      :null
  };

  if(id){
    state.shifts[
      state.shifts.findIndex(x=>x.id===id)
    ]=obj;
  }else{
    state.shifts.push(obj);
  }

  save();
  closeModal();
  render();
  notify('Shift saved');
}

function deleteShift(id){
  let s=state.shifts.find(x=>x.id===id);

  if(!s||paid(s))return;

  if(!confirm('Delete this unpaid shift?'))return;

  state.shifts=
    state.shifts.filter(x=>x.id!==id);

  save();
  closeModal();
  render();
}

}

    selectedPayIds()

            state.shifts.find(
              s=>s.id===id

function venmoMethod(s){
  return (s?.paymentMethods||[])
    .find(
      m=>String(m.label).toLowerCase()==='venmo'
    );
}

function venmoUrl(handle,amount,note){
  let h=String(handle||'')
    .trim()
    .replace(/^@/,'');

  let cleanNote=
    encodeURIComponent(
      note||'Sitter payment'
    );

  return `https://venmo.com/u/${encodeURIComponent(h)}?txn=pay&amount=${encodeURIComponent(amount.toFixed(2))}&note=${cleanNote}`;
}

function renderVenmoButton(){
  let box=$('payActions');

  if(!box)return;

  let s=sitter($('ps').value);
  let v=venmoMethod(s);
  let amount=selectedPayAmount();

  box.innerHTML=
    amount&&v
    ?`
      <div
        class="notice"
        style="margin:10px 0"
      >
        Venmo recipient:
        <strong>
          @${esc(String(v.handle).replace(/^@/,''))}
        </strong>
      </div>

      <button
        class="secondary"
        style="width:100%;margin-bottom:10px"
        onclick="openVenmo()"
      >
        Open Venmo — ${money(amount)}
      </button>
    `
    :'';
}

function openVenmo(){
  let s=sitter($('ps').value);
  let v=venmoMethod(s);
  let amount=selectedPayAmount();

  if(!v||!amount){
    return notify(
      'Select shifts and add a Venmo handle for this sitter'
    );
  }

  let note=
    $('pn').value.trim()||
    'Sitter payment';

  let url=
    venmoUrl(
      v.handle,
      amount,
      note
    );

  window.open(url,'_blank');
}

function recordPayment(){
  let ids=selectedPayIds();

  if(!ids.length){
    return notify('Select at least one shift');
  }

  let sh=
    state.shifts.filter(
      s=>ids.includes(s.id)
    );

  let amount=round(
    sh.reduce(
      (a,s)=>a+total(s),
      0
    )
  );

  let sid=$('ps').value;

  let p={
    id:uid(),
    sitterId:sid,
    sitterName:sitter(sid)?.name||'',
    date:$('pd').value,
    amount,
    method:$('pm').value,
    note:$('pn').value.trim(),
    shiftIds:ids
  };

  state.payments.push(p);

  sh.forEach(
    s=>s.paymentId=p.id
  );

  save();
  closeModal();
  render();
  notify('Payment recorded');
}

function showModal(html){
  closeModal();

  let d=document.createElement('div');

  d.id='modalRoot';
  d.className='modalbg';

  d.innerHTML=
    `<div class="modal">${html}</div>`;

  document.body.appendChild(d);

  d.addEventListener(
    'click',
    e=>{
      if(e.target===d)closeModal();
    }
  );
}

function closeModal(){
  document.getElementById('modalRoot')?.remove();
}

function exportData(){
  let blob=new Blob(
    [
      JSON.stringify(
        {
          version:2,
          sitters:state.sitters,
          shifts:state.shifts,
          payments:state.payments,
          settings:state.settings
        },
        null,
        2
      )
    ],
    {type:'application/json'}
  );

  let a=document.createElement('a');

  a.href=
    URL.createObjectURL(blob);

  a.download=
    'family-sitter-tracker-backup-'+
    today()+
    '.json';

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(a.href),
    1000
  );
}

function importData(e){
  let f=e.target.files[0];

  if(!f)return;

  let r=new FileReader();

  r.onload=()=>{
    try{
      let d=JSON.parse(r.result);

      if(
        !Array.isArray(d.sitters)||
        !Array.isArray(d.shifts)||
        !Array.isArray(d.payments)
      ){
        throw 0;
      }

      if(
        !confirm(
          'Replace all current tracker data with this backup?'
        )
      ){
        return;
      }

      state.sitters=d.sitters;
      state.shifts=d.shifts;
      state.payments=d.payments;

      state.settings={
        ...DEF,
        ...(d.settings||{})
      };

      normalize();
      save();
      render();

      notify('Backup imported');
    }catch{
      notify('Invalid backup file');
    }
  };

  r.readAsText(f);
}

function resetAll(){
  if(
    !confirm(
      'Clear ALL tracker data from this browser?'
    )
  ){
    return;
  }

  Object.values(K).forEach(
    k=>localStorage.removeItem(k)
  );

  sessionStorage.removeItem(
    'fst_unlocked'
  );

  location.reload();
}

load();

if(
  !sessionStorage.getItem(
    'fst_unlocked'
  )
){
  pin();
}else{
  render();
}
</script>
